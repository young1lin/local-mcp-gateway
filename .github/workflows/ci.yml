name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # engines claims >= 22.19.0 (undici 8 sets that floor), so CI covers the floor and current.
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
