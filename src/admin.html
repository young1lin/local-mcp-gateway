  row.addEventListener("dragover", function (e) {
    if (!state.dragging || state.dragging === row.dataset.name) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    var before = e.clientY < row.getBoundingClientRect().top + row.offsetHeight / 2;
    row.classList.toggle("drop-before", before);
    row.classList.toggle("drop-after", !before);
  });
  row.addEventListener("dragleave", function () {
    row.classList.remove("drop-before", "drop-after");
  });
  row.addEventListener("drop", function (e) {
    e.preventDefault();
    var before = e.clientY < row.getBoundingClientRect().top + row.offsetHeight / 2;
    var dragged = state.dragging;
    var target = rowOf(row.dataset.name);
    // Order first, then membership: moveRow re-renders from the flat list, and doing it after the
    // reassignment would drop the row into the new group at whatever slot it happened to hold.
    moveRow(dragged, row.dataset.name, before);
    if (target) assignGroup(dragged, groupOf(target) === DEFAULT_GROUP ? null : groupOf(target));
  });
  row.addEventListener("dragend", function () {
    state.dragging = null; // lets the deferred rebuild run — see patchSidebar
    row.classList.remove("dragging");
    document.querySelectorAll(".drop-before, .drop-after").forEach(function (r) {
      r.classList.remove("drop-before", "drop-after");
    });
    patchSidebar();
  });
}
/** A sidebar row is one line, so everything that used to be crammed onto a second one — the
 *  description, the source, the latency, the reason a row is red — lives here, and in the pane
 *  header for the selected MCP. */
function tooltipOf(m) {
  var bits = ["/" + m.name, m.type, m.source, state.busy[m.name] ? state.busy[m.name] + "…" : m.state];
  if (m.latencyMs != null) bits.push(m.latencyMs + " ms");
  if (m.description) bits.unshift(m.description);
  if (m.reason) bits.push(m.reason);
  return bits.join("  ·  ");
}

/** Patch existing rows in place; only rebuild when the visible set changes. Keeps scroll, keeps
 *  focus, and stops the whole list flashing on every poll.
 *
 *  While a drag is in flight (state.dragging) the rebuild is DEFERRED: a poll landing mid-drag would
 *  replace the DOM under the pointer and silently cancel it. Attribute patching never moves nodes,
 *  so rows stay live; dragend triggers one catch-up rebuild. */
function patchSidebar() {
  var list = $("list");
  var groups = groupedMcps();
  var rows = visibleMcps();
  // The rebuild key covers everything structural: which groups exist, what is in each, and which are
  // folded shut. Dot colour, latency and selection are patched below and stay out of it on purpose.
  var sig = groups.map(function (g) {
    return g.name + "\u0001" + (state.collapsed[g.name] ? "c" : "o") + "\u0001" +
      g.rows.map(function (m) { return m.name; }).join("\u0000");
  }).join("\u0002");

  if (list.dataset.sig !== sig && !state.dragging) {
    list.innerHTML = "";
    groups.forEach(function (g) { list.appendChild(groupNode(g)); });
    list.dataset.sig = sig;
  }
  rows.forEach(function (m) {
    var node = list.querySelector('[data-name="' + (window.CSS && CSS.escape ? CSS.escape(m.name) : m.name) + '"]');
    if (!node) return;
    var busyVerb = state.busy[m.name];
    node.querySelector(".dot").className = "dot " + (busyVerb ? "starting" : m.state);
    // Patched rather than set at build time: an Edit that switches an MCP from npx to http keeps the
    // same name, so the row is never rebuilt and the trailing label would otherwise go stale.
    var tagEl = node.querySelector(".side-type");
    var tag = m.tag || m.type || "";
    tagEl.textContent = tag;
    if (tag) tagEl.setAttribute("data-tag", tag);
    else tagEl.removeAttribute("data-tag");
    node.title = tooltipOf(m);
    node.setAttribute("aria-selected", state.selected === m.name ? "true" : "false");
  });

  var up = 0, bad = 0;
  state.mcps.forEach(function (m) {
    if (m.state === "up") up++;
    else if (m.state === "down" || m.state === "error") bad++;
  });
  // The chip belongs to whichever view is on screen; in the tunnel view it counts rules.
  if (state.view !== "tunnels") {
    $("countChip").textContent = state.mcps.length + " MCPs · " + up + " up" + (bad ? " · " + bad + " down" : "");
  }
  // Group headers name the sections now, so the standing "MCPS" caption is noise; it earns its line
  // only while a search is on, where the match count is the useful part.
  var cap = $("sideCap");
  cap.textContent = rows.length + " matching";
  cap.hidden = !state.filter;
}

/* --- rendering: detail pane ------------------------------------------------------------------- */
/** True when the user is typing inside the pane; a poll must never re-render over that. */
function paneHasFocus() {
  var a = document.activeElement;
  return !!a && $("pane").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}

function patchDetailHead() {
  var d = state.detail;
  if (!d) return;
  var m = rowOf(d.name);
  var dot = document.querySelector("#pane .pane-sub .dot");
  var txt = document.querySelector("#pane .pane-sub .sub-text");
  var primary = $("primaryBtn");
  if (!m || !dot || !txt) return;
  var busyVerb = state.busy[d.name];
  dot.className = "dot " + (busyVerb ? "starting" : m.state);
  txt.textContent = headSubtitle(m);
  if (primary) {
    var started = m.lifecycle === "started";
    primary.textContent = busyVerb ? "…" : (started ? "Stop" : "Start");
    primary.disabled = !!busyVerb;
    primary.onclick = function () { act(d.name, started ? "stop" : "start"); };
  }
}

function headSubtitle(m) {
  var bits = [];
  if (state.busy[m.name]) bits.push(state.busy[m.name] + "…");
  else bits.push(m.state);
  bits.push(m.type);
  bits.push(m.source);
  if (m.state === "up" && m.latencyMs != null) bits.push(m.latencyMs + " ms");
  if (m.startedAt) bits.push("since " + new Date(m.startedAt).toLocaleTimeString());
  return bits.join("  ·  ");
}

function renderPane() {
  // The tunnel view owns the pane while it is on screen. Without this, the 6s poll's loadList()
  // would reach its "nothing selected" branch and replace the tunnel list with the MCP empty state.
  if (state.view === "tunnels" || state.view === "traffic") return;
  var pane = $("pane");
  var d = state.detail;
  if (!d) {
    pane.innerHTML =
      '<div class="empty"><div><h2>' + (state.mcps.length ? "Select an MCP" : "No MCPs registered") + "</h2>" +
      '<p class="hint">' + (state.mcps.length ? "Its tools, resources and configuration appear here." : "Add one with the + on a group header.") + "</p></div></div>";
    return;
  }
  var m = rowOf(d.name) || { name: d.name, state: "unknown", type: "?", source: "?", lifecycle: "stopped" };
  var started = m.lifecycle === "started";
  var busyVerb = state.busy[d.name];
  var menuWasOpen = state.menuOpen; // reopened at the end; see the note there

  // The title is the MCP's identity, so it is set in the sans face. The mount path is a value you
  // copy, so it keeps the monospace one — down in the status line, where it costs nothing.
  var head =
    '<div class="pane-head">' +
      "<div>" +
        '<h1 class="pane-title">' + esc(d.name) + "</h1>" +
        (m.description ? '<div class="pane-desc">' + esc(m.description) + "</div>" : "") +
        '<div class="pane-sub"><span class="dot ' + esc(busyVerb ? "starting" : m.state) + '"></span>' +
          '<span class="sub-path">/' + esc(d.name) + "</span>" +
          '<span class="sub-text">' + esc(headSubtitle(m)) + "</span></div>" +
      "</div>" +
      '<div class="pane-actions">' +
        // Tinted only for Start: blue is the affirmative action, and a header full of blue Stop
        // buttons on six healthy MCPs says nothing. Stop is a plain button with the same footprint.
        '<button class="btn' + (started ? "" : " primary") + '" id="primaryBtn"' + (busyVerb ? " disabled" : "") + ">" +
          (busyVerb ? "…" : started ? "Stop" : "Start") + "</button>" +
        '<button class="btn icon" id="menuBtn" aria-label="More actions" title="More actions">&#183;&#183;&#183;</button>' +
      "</div>" +
    "</div>";

  var tabs = KINDS.concat(["run", "config", "logs"]);
  var seg = '<div class="seg" role="tablist">' + tabs.map(function (t) {
    var kd = KINDS.indexOf(t) >= 0 ? d[t] : null;
    var count = kd && kd.loaded ? '<span class="seg-n">' + (kd.total != null ? kd.total : kd.items.length) + "</span>" : "";
    var label = t.charAt(0).toUpperCase() + t.slice(1);
    return '<button role="tab" data-tab="' + t + '" aria-selected="' + (d.tab === t ? "true" : "false") + '">' + label + count + "</button>";
  }).join("") + "</div>";

  var reason = m.reason ? '<div class="note err">' + esc(m.reason) + "</div>" : "";
  var la = state.lastAction[d.name];
  var actionNote = la ? '<div class="note' + (la.err ? " err" : "") + '">' + esc(la.at + " · " + la.msg) + "</div>" : "";

  // One column holds the lot — header, tab bar, body, notes — so the measure is applied once and
  // they all share a left edge. Capping each of them individually looked identical until the pane
  // started centring: .seg is inline-flex, and an inline-level box ignores the auto margins that
  // centre a block, so the tab bar stayed at the pane's padding edge ~240px left of the card it
  // labels.
  //
  // One width for every tab, too. Logs used to opt into --measure-wide for its arguments column;
  // once the column is centred that widening moves BOTH edges, so switching Config <-> Logs slid the
  // whole page ~220px sideways and back. Changing tabs must not resize the page. The log rows lose
  // nothing structural at the standard measure — .call-arg is a truncating preview, so it just
  // ellipsises earlier, and the full request and reply are one click away in the expanded row.
  pane.innerHTML = '<div class="col">' + head + seg +
    '<div id="tabbody">' + tabBody(d, m) + "</div>" + reason + actionNote + "</div>";

  // Wire up (no inline handlers — names can contain characters that break string-built onclicks).
  $("primaryBtn").onclick = function () { act(d.name, started ? "stop" : "start"); };
  $("menuBtn").onclick = function (ev) { ev.stopPropagation(); toggleMenu(d, m); };
  pane.querySelectorAll(".seg button").forEach(function (b) {
    b.onclick = function () { showTab(b.dataset.tab); };
  });
  wireTabBody(d, m);
  // A late tools/list response re-renders the pane; without this the ... menu you opened a moment
  // ago would just disappear. The menu is state, so it is restored like any other.
  if (menuWasOpen) openMenu(d, m);
}

/** The overflow menu is attached and removed on its own, without re-rendering the pane — otherwise
 *  opening it would rebuild (and clear) a config form that was mid-edit. */
function toggleMenu(d, m) {
  var wasOpen = state.menuOpen;
  closeMenu();
  if (wasOpen) return;
  openMenu(d, m);
}
function openMenu(d, m) {
  var host = document.querySelector("#pane .pane-actions");
  if (!host) return;
  // Re-resolve the row from live state instead of trusting the one renderPane closed over. The 6s
  // poll's loadList() REPLACES state.mcps wholesale, and it only patches the header afterwards — so
  // the captured object is orphaned from that moment on. The menu reads two things off it that
  // change (which group the MCP is in, and whether it is config-sourced), and with a stale object
  // the group tick stayed on whatever it was when the pane was last rendered.
  var live = rowOf(d.name) || m;
  host.insertAdjacentHTML("beforeend", menuHtml(live));
  state.menuOpen = true;
  wireMenu(d, live);
}
function closeMenu() {
  var node = $("menu");
  if (node) node.remove();
  state.menuOpen = false;
}

/** Grouped like a macOS menu: connect, then which group it is in, then manage, then the destructive
 *  one on its own. The group section is a pick list with a tick, not a submenu — a submenu built from
 *  a string is more machinery than four lines of choices are worth. */
function menuHtml(m) {
  var current = groupOf(m);
  var picks = [DEFAULT_GROUP].concat(state.groups).map(function (g) {
    return '<button class="pick' + (g === current ? " on" : "") + '" data-grp="' + esc(g) + '">' + esc(g) + "</button>";
  }).join("");
  return '<div class="menu" id="menu">' +
    '<div class="menu-cap">Connect a client</div>' +
    '<button data-act="cp-claude">Copy Claude Code command</button>' +
    '<button data-act="cp-codex">Copy Codex command</button>' +
    '<button data-act="cp-json">Copy .mcp.json entry</button>' +
    '<button data-act="cp-url">Copy endpoint URL</button>' +
    "<hr>" +
    '<div class="menu-cap">Group</div>' +
    picks +
    '<button data-act="new-group">New group…</button>' +
    "<hr>" +
    '<button data-act="restart">Restart</button>' +
    '<button data-act="edit">Edit configuration…</button>' +
    '<button data-act="rename">Rename…</button>' +
    (m.source === "config" ? "" : '<hr><button class="danger" data-act="delete">Delete</button>') +
    "</div>";
}
function wireMenu(d, m) {
  $("menu").querySelectorAll("button").forEach(function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      closeMenu();
      if (b.dataset.grp !== undefined) {
        assignGroup(d.name, b.dataset.grp === DEFAULT_GROUP ? null : b.dataset.grp);
        return;
      }
      var a = b.dataset.act;
      if (a === "new-group") {
        // Make the group, then put this MCP straight into it — otherwise "New group…" from an MCP's
        // own menu would create an empty group and leave the MCP where it was.
        (async function () {
          var name = prompt("New group name:", "");
          if (name === null || !name.trim()) return;
          if (await saveGroups(state.groups.concat([name.trim()]))) assignGroup(d.name, name.trim());
        })();
        return;
      }
      if (a === "restart") act(d.name, "restart");
      else if (a === "rename") renameMcp(d.name);
      else if (a === "delete") removeMcp(d.name);
      else if (a === "edit") { d.tab = "config"; startEdit(); }
      else if (a === "cp-url") copyText(endpointUrl(d.name), "Endpoint URL");
      else if (a === "cp-claude") copyConn(d.name, "claude");
      else if (a === "cp-codex") copyConn(d.name, "codex");
      else if (a === "cp-json") copyConn(d.name, "json");
    };
  });
}

/* --- connecting a client ---------------------------------------------------------------------- */
/**
 * Client configuration is built here, in the browser, from the endpoint URL and the live bearer
 * token (fetched once into state.token). Each copied command embeds the token, so paste = ready — no
 * separate step of exporting the token in whatever shell the command lands in.
 */
function tokenEnv() {
  return (state.info && state.info.tokenEnv) || "MCP_GATEWAY_TOKEN";
}
function endpointUrl(name) {
  return location.origin + "/" + name;
}
/**
 * The secret a copied connect command embeds.
 *
 * Copies use the token last marked with Use, or — with no prior choice — the seed token labeled
 * `default`. That way a fresh panel with several tokens still copies without a prompt (the Cursor
 * IDE browser cannot answer `prompt()`, and a cancelled prompt used to look like a copy failure).
 * When there are no tokens at all it creates `default` rather than sending you to another panel.
 */
async function resolveSecret() {
  await refreshTokens();
  var list = state.tokens || [];

  if (!list.length) {
    var made = await apiJson("/api/tokens", { method: "POST", body: JSON.stringify({ label: "default" }) });
    if (!made) return null;
    await refreshTokens();
    return useToken(made.id, made.secret);
  }

  var pick = pickCopyToken(list, rememberedTokenId());
  if (!pick) return null;
  if (state.activeSecret && rememberedTokenId() === pick.id) return state.activeSecret;
  return fetchSecret(pick.id);
}

async function fetchSecret(id) {
  var j = await apiJson("/api/tokens/" + encodeURIComponent(id) + "/secret");
  if (!j) return null;
  return useToken(j.id, j.secret);
}

/** Remember which token the copy actions embed — by id, so a rotate is picked up automatically. */
function useToken(id, secret) {
  state.activeSecret = secret;
  try { localStorage.setItem(TOKEN_ID_KEY, id); } catch (e) { /* blocked — this session still works */ }
  return secret;
}

/** Copy a connect command for one MCP, embedding the active token secret. */
async function copyConn(name, kind) {
  var secret = await resolveSecret();
  if (!secret) return;
  var text = kind === "claude" ? claudeSnippet(name, secret)
    : kind === "codex" ? codexSnippet(name, secret) : mcpJsonSnippet(name, secret);
  copyText(text, kind === "claude" ? "Claude Code command" : kind === "codex" ? "Codex block" : ".mcp.json entry");
}

/** `claude mcp add` — one line, secret embedded. Runs in any shell (cmd, PowerShell, bash, zsh). */
function claudeSnippet(name, secret) {
  return 'claude mcp add --transport http -s user ' + name + " " + endpointUrl(name) +
    ' --header "Authorization: Bearer ' + secret + '"';
}

/** Codex has no one-line add for an HTTP server, so copy this block into ~/.codex/config.toml. */
function codexSnippet(name, secret) {
  return "[mcp_servers." + name + "]\n" +
    'type = "http"\n' +
    'url = "' + endpointUrl(name) + '"\n' +
    'headers = { "Authorization" = "Bearer ' + secret + '" }';
}

/** A `.mcp.json` entry for project-scoped Claude Code; the secret is inline. */
function mcpJsonSnippet(name, secret) {
  var entry = {};
  entry[name] = { type: "http", url: endpointUrl(name), headers: { Authorization: "Bearer " + secret } };
  return JSON.stringify({ mcpServers: entry }, null, 2);
}

async function copyText(text, label) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else legacyCopy(text);
    toast(label + " copied — the token is embedded.");
  } catch (e) {
    legacyCopy(text);
    toast(label + " copied");
  }
}

/** Fallback for a browser that withholds the async clipboard (or a non-secure origin). */
function legacyCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) { /* nothing else to try */ }
  document.body.removeChild(ta);
}
document.addEventListener("click", function () { if (state.menuOpen) closeMenu(); });

function tabBody(d, m) {
  if (d.tab === "run") return runBody(d, m);
  if (d.tab === "config") return configBody(d);
  if (d.tab === "logs") return logsBody(d);
  return kindBody(d, d.tab, m);
}

/* --- Logs: what was called, with what, and what came back ------------------------------------- */
function fmtChars(n) {
  return n < 1000 ? n + " chars" : (n / 1000).toFixed(1) + "k chars";
}

/**
 * Format a tool result for reading.
 *
 * A result travels compact — indentation is dead weight in a model's context — but nobody can read a
 * 2 KB single-line object, so the panel expands it here. A trailing "[showing the first N of M …]"
 * note from the gateway is kept out of the parse and re-appended. Anything that is not JSON (a plain
 * string, an error message, a clipped log entry) is shown exactly as it arrived.
 */
function fmtJson(text) {
  if (!text) return "";
  var body = text, tail = "";
  var cut = text.lastIndexOf("\n\n[");
  if (cut > 0 && text.charAt(text.length - 1) === "]") { body = text.slice(0, cut); tail = text.slice(cut); }
  var trimmed = body.trim();
  if (trimmed.charAt(0) !== "{" && trimmed.charAt(0) !== "[") return text;
  try {
    return JSON.stringify(JSON.parse(trimmed), null, 2) + tail;
  } catch (e) {
    return text; // truncated or not actually JSON — better raw than pretended
  }
}

function callHtml(d, c) {
  var when = new Date(c.at).toLocaleString();
  var meta = when + "  ·  " + c.via + (c.client ? "  ·  " + c.client : "") + "  ·  " + c.ms + " ms  ·  " + fmtChars(c.chars);
  // A page ships only the head of each reply. Offer the rest instead of leaving a dangling tail.
  var full = d.callsFull[c.seq];
  var body = full != null ? full : c.output;
  var more = c.preview && full == null
    ? '<div class="form-actions"><button class="btn" data-full="' + c.seq + '">Show full result (' + esc(fmtChars(c.chars)) + ")</button></div>"
    : "";
  return '<div class="call' + (d.callsOpen[c.seq] ? " open" : "") + '" data-seq="' + c.seq + '">' +
    '<div class="call-sum" data-callseq="' + c.seq + '" role="button" tabindex="0">' +
      '<span class="chev">&#8250;</span>' +
      '<span class="dot ' + (c.ok ? "up" : "down") + '"></span>' +
      '<span class="call-tool">' + esc(c.tool) + "</span>" +
      '<span class="call-arg">' + esc(c.args || "no arguments") + "</span>" +
      '<span class="call-meta">' + esc(meta) + "</span>" +
    "</div>" +
    '<div class="call-body">' +
      '<div class="call-lbl">Arguments</div><pre class="logs">' + esc(fmtJson(c.args) || "(none)") + "</pre>" +
      '<div class="call-lbl">' + (c.ok ? "Result" : "Error") + "</div>" +
      '<pre class="logs' + (c.ok ? "" : " err") + '" data-out="' + c.seq + '">' + esc(fmtJson(body) || "(empty)") + "</pre>" +
      more +
    "</div></div>";
}

function logsBody(d) {
  if (d.calls == null) return '<div class="note"><span class="spin"></span> Loading calls…</div>';
  var head = '<div class="sec-head"><span class="sec-cap">Tool calls · newest first</span>' +
    '<button class="btn" id="callsClear"' + (d.calls.length || d.callsPage ? "" : " disabled") + ">Clear</button></div>";
  var body = d.calls.length
    ? '<div class="group">' + d.calls.map(function (c) { return callHtml(d, c); }).join("") + "</div>"
    : '<div class="group"><div class="row"><span class="rowmsg">' +
      (d.callsPage ? "Nothing on this page." : "No calls yet. Every tool invocation — from an MCP client or from the Run tab — is recorded here with its arguments and its reply, and the log is kept on disk across restarts.") +
      "</span></div></div>";
  var pager = (d.callsPage > 0 || d.callsMore)
    ? '<div class="pager"><button class="btn" id="clPrev"' + (d.callsPage > 0 ? "" : " disabled") + ">Newer</button>" +
      "<span>Page " + (d.callsPage + 1) + "</span>" +
      '<button class="btn" id="clNext"' + (d.callsMore ? "" : " disabled") + ">Older</button></div>"
    : "";
  var err = "";
  if (d.stderr) {
    err = '<div class="sec-head" style="padding-top:var(--s5)"><span class="sec-cap">Child process stderr</span></div>' +
      '<div class="group"><pre class="logs">' + esc(d.stderr) + "</pre></div>";
  } else if ((d.config && d.config.type) === "proc") {
    /* An empty stderr on a proc answers a different question depending on whether a child exists
       yet. Blank space here reads as "logs went missing" — say which of the three blanks it is. */
    var st = (rowOf(d.name) || {}).lifecycle;
    var why = st === "idle"
      ? "No child process yet — a lazy proc starts on the first request (or the Start button). If that start fails, the failure reason and whatever the child printed land here."
      : st === "error"
        ? "The child printed nothing before failing — the failure reason is in this MCP's header and on the Config tab."
        : "The child is running but has printed nothing to stderr — nothing is being swallowed.";
    err = '<div class="sec-head" style="padding-top:var(--s5)"><span class="sec-cap">Child process stderr</span></div>' +
      '<div class="group"><div class="row"><span class="rowmsg">' + why + "</span></div></div>";
  }
  return head + body + pager + err;
}

/** Expand/collapse one call without re-rendering: a poll must not close what you just opened. */
function toggleCall(seq) {
  var d = state.detail;
  if (!d) return;
  d.callsOpen[seq] = !d.callsOpen[seq];
  var node = document.querySelector('#tabbody .call[data-seq="' + seq + '"]');
  if (node) node.className = "call" + (d.callsOpen[seq] ? " open" : "");
}

/** One truncated line of argument names, required ones in bold. `args` is [{ name, req }].
 *  The title carries the full list, because the line is clipped rather than wrapped and a tool with
 *  eight arguments would otherwise lose the last four with no way to see them from here. */
function argLine(args) {
  if (!args.length) return "";
  var plain = args.map(function (a) { return a.name; }).join(", ");
  return '<div class="args" title="' + esc(plain) + '">' + args.map(function (a) {
    return a.req ? "<b>" + esc(a.name) + "</b>" : esc(a.name);
  }).join(", ") + "</div>";
}

function kindBody(d, kind, m) {
  var kd = d[kind];
  // Resources get a master on/off at the top: off empties the list (the capability stays, so the
  // notify stays valid) and tells connected clients to re-list. Symmetric with the per-tool toggle.
  var resToggle = "";
  if (kind === "resources" && kd.loaded) {
    var on = kd.resourceEnabled !== false;
    resToggle = '<div class="row row-act"><div class="row-main"><div class="name">Expose resources</div>' +
      '<div class="desc">' + (on ? "visible to clients" : "hidden — clients see no resources") + "</div></div>" +
      '<button class="sw" role="switch" aria-checked="' + (on ? "true" : "false") +
      '" aria-label="Expose resources" data-restog="' + (on ? "1" : "0") + '" title="' +
      (on ? "Click to hide all resources" : "Click to expose resources") + '"></button></div>';
  }
  if (m.lifecycle !== "started") {
    return '<div class="group"><div class="row"><span class="rowmsg">Not started — start it to list ' + kind + ".</span></div></div>";
  }
  if (kd.loading && !kd.loaded) return '<div class="note"><span class="spin"></span> Loading ' + kind + "…</div>";
  if (kd.error) {
    // Keep the pager: pageNext/pagePrev push the cursor optimistically, so a failed page used to
    // leave the tab with no way back except the global Refresh (which resets to page one).
    var errPager = kd.cursors.length > 1
      ? '<div class="pager"><button class="btn" id="pgPrev">Previous</button><span>Page ' + kd.cursors.length +
        '</span><button class="btn" id="pgNext"' + (kd.nextCursor ? "" : " disabled") + ">Next</button></div>"
      : "";
    return '<div class="group"><div class="row"><span class="rowmsg warn">' + esc(kd.error) +
      "</span></div></div>" + errPager;
  }
  var rows;
  if (!kd.items.length && !(kind === "tools" && kd.disabled && kd.disabled.length)) {
    // An empty list still needs the toggle bar above it (resources can be hidden, not just absent),
    // so this is composed into `rows` and the resToggle header is added by the normal return below
    // rather than short-circuiting out of the function.
    var emptyMsg = kind === "resources" && kd.resourceEnabled === false
      ? "Resources are hidden — turn them on above to expose them to clients."
      : "No " + kind + ".";
    rows = '<div class="row"><span class="rowmsg">' + esc(emptyMsg) + "</span></div>";
  } else {
    rows = kd.items.map(function (it) {
    if (kind === "resources") {
      // Read mirrors the tools' Try button: a resource is only believable once you have seen its
      // contents, and its URI is the whole input, so no form is needed.
      return '<div class="row row-act"><div class="row-main"><div class="name">' + esc(it.uri) + "</div>" +
        (it.name ? '<div class="desc">' + esc(it.name) + "</div>" : "") +
        (it.description ? '<div class="desc">' + esc(it.description) + "</div>" : "") + "</div>" +
        '<button class="btn" data-read="' + esc(it.uri) + '" title="Read this resource">Read</button></div>';
    }
    var args = "";
    if (kind === "prompts" && it.arguments && it.arguments.length) {
      args = argLine(it.arguments.map(function (a) { return { name: a.name, req: !!a.required }; }));
    }
    if (kind === "tools" && it.inputSchema && it.inputSchema.properties) {
      var req = it.inputSchema.required || [];
      args = argLine(Object.keys(it.inputSchema.properties).map(function (k) {
        return { name: k, req: req.indexOf(k) >= 0 };
      }));
    }
    var main = '<div class="name">' + esc(it.name) + "</div>" +
      (it.description ? '<div class="desc">' + esc(it.description) + "</div>" : "") + args;
    // Tools get a Try button: it opens Run with this tool already selected, so a tool can be
    // exercised from the list it was found in. A toggle turns the tool off for clients — it drops
    // out of tools/list and clients are told to re-list (notifications/tools/list_changed).
    if (kind === "tools") {
      return '<div class="row row-act"><div class="row-main">' + main + "</div>" +
        '<button class="btn" data-try="' + esc(it.name) + '" title="Try this tool">Try</button>' +
        '<button class="sw" role="switch" aria-checked="true" aria-label="Visible to clients" data-toggle="' +
        esc(it.name) + '" data-on="1" title="Visible to clients — click to hide"></button></div>';
    }
    return '<div class="row row-b">' + main + "</div>";
  }).join("");
  }

  // Disabled tools are absent from the live list, so they get their own rows here — greyed, with the
  // toggle the other way, so a tool can be switched back on from the same place it was switched off.
  if (kind === "tools" && kd.disabled && kd.disabled.length) {
    rows += '<div class="group-cap">Disabled — not shown to clients</div>';
    rows += kd.disabled.map(function (name) {
      return '<div class="row row-act muted"><div class="row-main"><div class="name">' + esc(name) + "</div>" +
        '<div class="desc">hidden from tools/list until re-enabled</div></div>' +
        '<button class="sw" role="switch" aria-checked="false" aria-label="Visible to clients" data-toggle="' +
        esc(name) + '" data-on="0" title="Turn this tool on"></button></div>';
    }).join("");
  }

  var page = kd.cursors.length;
  var pages = kd.total != null ? " of " + Math.max(1, Math.ceil(kd.total / kd.pageSize)) : "";
  var pager = (page > 1 || kd.nextCursor)
    ? '<div class="pager"><button class="btn" id="pgPrev"' + (page <= 1 ? " disabled" : "") + ">Previous</button>" +
      "<span>Page " + page + pages + (kd.loading ? ' <span class="spin"></span>' : "") + "</span>" +
      '<button class="btn" id="pgNext"' + (kd.nextCursor ? "" : " disabled") + ">Next</button></div>"
    : "";
  return (resToggle ? '<div class="group">' + resToggle + "</div>" : "") + '<div class="group">' + rows + "</div>" + pager;
}

/* --- Run: invoke a tool from the panel -------------------------------------------------------- */
/** Argument inputs generated from the tool's own inputSchema, so this works for any MCP the gateway
 *  hosts — including a proc child whose tools the gateway knows nothing about. */
function argFieldsHtml(tool) {
  var schema = tool.inputSchema || {};
  var props = schema.properties || {};
  var required = schema.required || [];
  var keys = Object.keys(props);
  if (!keys.length) return '<div class="hint">This tool takes no arguments.</div>';
  return keys.map(function (k) {
    var p = props[k] || {};
    var id = "r-arg-" + k;
    var kind = p.type === "array" ? "array"
      : p.type === "object" ? "object"
      : p.type === "boolean" ? "boolean"
      : (p.type === "number" || p.type === "integer") ? "number" : "string";
    // Not escaped with the key: the star is markup, so it is concatenated after esc(k), never into it.
    var star = required.indexOf(k) >= 0 ? ' <span class="req-star">*</span>' : "";
    var hint = p.description ? '<div class="hint">' + esc(p.description) + "</div>" : "";
    // esc() on the id too: the key comes from the tool's own inputSchema, and a proc MCP's child
    // controls that completely — an unescaped key like `x" autofocus onfocus="…` breaks out of the
    // attribute and runs on render. getElementById still matches, because the browser decodes the
    // entities back to the raw key when it parses the attribute.
    var attrs = ' id="' + esc(id) + '" data-arg="' + esc(k) + '" data-kind="' + kind + '"';
    if (kind === "boolean") {
      // Name and star in one span: .check is a flex row with an 8px gap, so a bare text node would
      // leave the star floating a gap away from the name it belongs to.
      return '<div><label class="check"><input type="checkbox"' + attrs + "><span>" + esc(k) + star +
        "</span></label>" + hint + "</div>";
    }
    // A constrained field renders as a dropdown rather than a free-text box that shows the allowed
    // values nowhere. The blank first option keeps "leave this argument out" reachable.
    if (Array.isArray(p.enum) && p.enum.length) {
      var opts = '<option value=""></option>' + p.enum.map(function (v) {
        return '<option value="' + esc(v) + '">' + esc(v) + "</option>";
      }).join("");
      return '<div><label class="field"><span>' + esc(k) + star + "  ·  " + esc(kind) + "</span>" +
        "<select" + attrs + ">" + opts + "</select></label>" + hint + "</div>";
    }
    var area = kind === "array" || kind === "object" || k === "sql";
    var itemType = kind === "array" && p.items && p.items.type ? String(p.items.type) : "";
    if (itemType) attrs += ' data-items="' + esc(itemType) + '"';
    var ph = k === "sql" ? "SELECT 1"
      : kind === "array" ? "one value per line" + (itemType ? " (" + itemType + ")" : "")
      : kind === "object" ? "{ }" : "";
    var input = area
      ? "<textarea" + attrs + ' placeholder="' + esc(ph) + '"></textarea>'
      : '<input type="text"' + attrs + ' placeholder="' + esc(ph) + '">';
    return '<div><label class="field"><span>' + esc(k) + star + "  ·  " + esc(kind) + "</span>" + input + "</label>" + hint + "</div>";
  }).join("");
}

function readRunArgs(tool) {
  var out = {};
  var props = (tool && tool.inputSchema && tool.inputSchema.properties) || {};
  Object.keys(props).forEach(function (k) {
    var node = $("r-arg-" + k);
    if (!node) return;
    var kind = node.dataset.kind;
    if (kind === "boolean") { if (node.checked) out[k] = true; return; }
    var raw = node.value.trim();
    if (raw === "") return;
    if (kind === "number") { var n = Number(raw); if (!isNaN(n)) out[k] = n; return; }
    if (kind === "array") {
      // Coerce each line to the declared item type: a schema saying items are numbers and getting
      // ["1","2"] is rejected by any server that validates its input.
      var itemType = node.dataset.items || "";
      out[k] = raw.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean).map(function (s) {
        if (itemType === "number" || itemType === "integer") { var n = Number(s); return isNaN(n) ? s : n; }
        if (itemType === "boolean") return s === "true" ? true : s === "false" ? false : s;
        return s;
      });
      return;
    }
    if (kind === "object") { try { out[k] = JSON.parse(raw); } catch (e) { throw new Error("`" + k + "` is not valid JSON"); } return; }
    out[k] = raw;
  });
  return out;
}

function runBody(d, m) {
  if (m.lifecycle !== "started") {
    return '<div class="group"><div class="row"><span class="rowmsg">Not started — start it to run a tool.</span></div></div>';
  }
  var kd = d.tools;
  if (kd.loading && !kd.loaded) return '<div class="note"><span class="spin"></span> Loading tools…</div>';
  if (kd.error) return '<div class="group"><div class="row"><span class="rowmsg warn">' + esc(kd.error) + "</span></div></div>";
  var tools = kd.items || [];
  if (!tools.length) return '<div class="group"><div class="row"><span class="rowmsg">This MCP exposes no tools.</span></div></div>';

  var current = null;
  for (var i = 0; i < tools.length; i++) if (tools[i].name === d.run.tool) current = tools[i];
  if (!current) current = tools[0];
  d.run.tool = current.name;

  var opts = tools.map(function (t) {
    return '<option value="' + esc(t.name) + '"' + (t.name === current.name ? " selected" : "") + ">" + esc(t.name) + "</option>";
  }).join("");

  return '<div class="group"><div class="form">' +
      '<label class="field"><span>Tool</span><select id="r-tool">' + opts + "</select></label>" +
      (current.description ? '<div class="hint">' + esc(current.description) + "</div>" : "") +
      argFieldsHtml(current) +
      '<div class="form-actions"><button class="btn primary" id="runBtn">Run</button>' +
        '<span class="run-meta" id="runMeta"></span></div>' +
      '<pre class="logs" id="runOut"></pre>' +
    "</div></div>";
}

async function runTool() {
  var d = state.detail;
  if (!d || d.run.running) return;
  var tools = d.tools.items || [];
  var toolDef = null;
  for (var i = 0; i < tools.length; i++) if (tools[i].name === d.run.tool) toolDef = tools[i];
  if (!toolDef) return;
  var args;
  try {
    args = readRunArgs(toolDef);
  } catch (err) {
    d.run.result = { ok: false, text: err.message, ms: 0 };
    renderRunResult();
    return;
  }
  d.run.running = true;
  var btn = $("runBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Running…"; }
  var meta = $("runMeta");
  if (meta) meta.innerHTML = '<span class="spin"></span>';
  try {
    var r = await api("/api/mcps/" + encodeURIComponent(d.name) + "/call", {
      method: "POST", body: JSON.stringify({ tool: d.run.tool, arguments: args }),
    });
    var j = await r.json().catch(function () { return {}; });
    d.run.result = {
      ok: !!j.ok && !j.isError,
      text: j.text != null && j.text !== "" ? j.text : (j.error || "(no output)"),
      ms: j.ms,
    };
  } catch (e) {
    d.run.result = { ok: false, text: "request failed", ms: 0 };
  }
  d.run.running = false;
  renderRunResult();
}

/** Update only the output and the meta line — never the form, so the SQL you typed survives a run. */
function renderRunResult() {
  var d = state.detail;
  var running = !!(d && d.run.running);
  var btn = $("runBtn");
  // Also called right after a pane rebuild, which may land mid-run — keep the button honest.
  if (btn) { btn.disabled = running; btn.textContent = running ? "Running…" : "Run"; }
  var out = $("runOut"), meta = $("runMeta");
  if (!out || !d) return;
  var res = d.run.result;
  if (!res) { out.textContent = ""; if (meta) meta.textContent = ""; return; }
  // Formatted for reading; the size in the meta line is the real (compact) reply.
  out.textContent = fmtJson(res.text);
  out.className = "logs" + (res.ok ? "" : " err");
  if (meta) {
    var bytes = new TextEncoder().encode(res.text).length;
    meta.textContent = (res.ok ? "ok" : "error") + "  ·  " + (res.ms != null ? res.ms + " ms" : "") +
      "  ·  " + (bytes < 1024 ? bytes + " B" : (bytes / 1024).toFixed(1) + " KB");
  }
}

function configBody(d) {
  if (d.editing) {
    var type = d.editType || (d.config && d.config.type) || "proc";
    // Stored values for the MCP's own type, nothing for a different one — then whatever the user has
    // already typed on top, so a type switch or a rejected save doesn't empty the form.
    var vals = Object.assign({}, type === ((d.config && d.config.type) || "proc") ? d.config : {}, d.editVals || {});
    // The stored def carries `lazy`; the form shows its inverse as "Start automatically". A stored
    // def with no lazy at all gets the type's default (proc off, everything else on).
    if (vals.lazy !== undefined) vals.autostart = !vals.lazy;
    else if (vals.autostart === undefined) vals.autostart = type !== "proc";
    var opts = Object.keys(TYPE_FIELDS).map(function (t) {
      return '<option value="' + t + '"' + (t === type ? " selected" : "") + ">" + esc(TYPE_LABELS[t] || t) + "</option>";
    }).join("");
    return '<div class="group"><div class="form">' +
      '<label class="field"><span>Type</span><select id="e-type">' + opts + "</select></label>" +
      fieldsHtml(type, vals, "e-") +
      '<div class="form-actions"><button class="btn primary" id="e-save">Save &amp; Restart</button>' +
      (TESTABLE_TYPES.indexOf(type) >= 0
        ? '<button class="btn" id="e-test">Test connection</button>'
        : "") +
      '<button class="btn" id="e-cancel">Cancel</button></div>' +
      '<div class="hint" id="e-test-out" hidden></div>' +
      "</div></div>";
  }
  var c = d.config;
  if (!c) return '<div class="note"><span class="spin"></span> Loading…</div>';
  var rows = Object.keys(c).map(function (k) {
    var v = c[k];
    if (v == null || v === "") return "";
    /* An array (a rest MCP's tools, a disabled-tool list) is not a KEY=VALUE map — envToText turns one
       into `0=[object Object]`. */
    var text = typeof v === "object" ? (Array.isArray(v) ? JSON.stringify(v) : envToText(v)) : String(v);
    return '<div class="row"><span class="k">' + esc(k) + '</span><span class="v wrap">' + esc(text) + "</span></div>";
  }).join("");
  var note = d.source === "config"
    ? '<div class="note">Defined in gateway.config.json. Edits are saved as an override in managed.json; ' +
      "<code>${ENV}</code> references are kept as references, so no credential is written to disk.</div>"
    : "";
  return tunnelDepsHtml(d) + '<div class="group">' + rows + "</div>" + note +
    '<div class="form-actions" style="padding-top:var(--s4)"><button class="btn" id="c-edit">Edit configuration…</button></div>';
}

/**
 * The tunnels this MCP's traffic goes through. When a health check fails, the answer to "is it the
 * tunnel or the database?" belongs on the same screen as the failure.
 *
 * The stale-pool line is information only, by explicit decision: a reconnect after this MCP started
 * means its pool may hold sockets of the old SSH session, and the fix is the Restart button that is
 * already there. Nothing restarts an MCP on its own.
 */
function tunnelDepsHtml(d) {
  var t = d.tunnels;
  if (!t || !t.length) return "";
  var rows = t.map(function (x) {
    var dot = x.state === "up" ? "up" : x.state === "error" ? "error" : x.state === "reconnecting" ? "starting" : "";
    return '<div class="row"><span class="k">tunnel</span><span class="v">' +
      '<span class="dot ' + dot + '" style="display:inline-block;margin-right:6px"></span>' +
      esc(x.name) + " · " + esc(String(x.localPort)) + " &rarr; " + esc(x.targetHost + ":" + x.targetPort) +
      " · " + esc(x.state) + (x.reason ? " — " + esc(x.reason) : "") +
      (x.stalePool
        ? '<div class="tun-err">reconnected after this MCP started — its connection pool may hold dead sockets. ' +
          'Use Restart above.</div>'
        : "") +
      "</span></div>";
  }).join("");
  return '<div class="cap">Depends on</div><div class="group">' + rows + "</div><div style=\"height:var(--s5)\"></div>";
}

function wireTabBody(d, m) {
  var prev = $("pgPrev"); if (prev) prev.onclick = pagePrev;
  var next = $("pgNext"); if (next) next.onclick = pageNext;
  var edit = $("c-edit"); if (edit) edit.onclick = startEdit;
  var save = $("e-save"); if (save) save.onclick = saveEdit;
  var cancel = $("e-cancel"); if (cancel) cancel.onclick = cancelEdit;
  var testBtn = $("e-test"); if (testBtn) testBtn.onclick = function () { void runConnTest("e-"); };
  var type = $("e-type"); if (type) type.onchange = function () { changeEditType(type.value); };

  // Tools list → Try
  document.querySelectorAll("#tabbody [data-try]").forEach(function (b) {
    b.onclick = function () { tryTool(b.dataset.try); };
  });

  // Resources list → Read
  document.querySelectorAll("#tabbody [data-read]").forEach(function (b) {
    b.onclick = function () { void readResource(b.dataset.read, b); };
  });

  // Tools list → on/off toggle
  document.querySelectorAll("#tabbody [data-toggle]").forEach(function (b) {
    b.onclick = function () { void toggleTool(b.dataset.toggle, b.dataset.on === "1", b); };
  });

  // Resources → master on/off
  document.querySelectorAll("#tabbody [data-restog]").forEach(function (b) {
    b.onclick = function () { void toggleResources(b.dataset.restog === "1", b); };
  });

  // Logs tab
  var clear = $("callsClear");
  if (clear) clear.onclick = clearCalls;
  var clPrev = $("clPrev"); if (clPrev) clPrev.onclick = function () { callsPageStep(-1); };
  var clNext = $("clNext"); if (clNext) clNext.onclick = function () { callsPageStep(1); };
  document.querySelectorAll("#tabbody [data-callseq]").forEach(function (s) {
    s.onclick = function () { toggleCall(s.dataset.callseq); };
    s.onkeydown = function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggleCall(s.dataset.callseq); }
    };
  });
  document.querySelectorAll("#tabbody [data-full]").forEach(function (b) {
    b.onclick = function (ev) { ev.stopPropagation(); showFullResult(b.dataset.full); };
  });

  // Run tab
  var toolSel = $("r-tool");
  if (toolSel) {
    toolSel.onchange = function () { d.run.tool = toolSel.value; d.run.result = null; renderPane(); };
  }
  var runBtn = $("runBtn");
  if (runBtn) {
    runBtn.onclick = runTool;
    // Ctrl/Cmd+Enter runs, so a SQL textarea can be submitted without reaching for the mouse.
    document.querySelectorAll("#tabbody textarea, #tabbody input[type=text]").forEach(function (f) {
      f.addEventListener("keydown", function (ev) {
        if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { ev.preventDefault(); runTool(); }
      });
    });
  }
  if ($("runOut")) renderRunResult();
}

/** Jump from the Tools list into Run with that tool preselected. */
function tryTool(name) {
  var d = state.detail;
  if (!d) return;
  d.run.tool = name;
  d.run.result = null;
  showTab("run");
}

/** Toggle all of an MCP's resources on/off. Live: the server answers an empty list while off and
 *  pushes notifications/resources/list_changed, so this just fires the change and reloads. */
async function toggleResources(currentlyOn, btn) {
  if (!state.selected) return;
  btn.disabled = true;
  var j = await apiJson("/api/mcps/" + encodeURIComponent(state.selected) + "/resources-toggle", {
    method: "POST",
    body: JSON.stringify({ enabled: !currentlyOn }),
  });
  btn.disabled = false;
  if (!j) return;
  if (j.unchanged) { toast("Already " + (currentlyOn ? "on" : "off")); return; }
  var d = state.detail;
  if (d) { d.resources.loaded = false; d.resources.cursors = []; void loadPage(d.name, "resources"); }
}

/** Toggle a tool on/off for clients. Live: the server filters the next tools/list and pushes
 *  notifications/tools/list_changed, so this just fires the change and reloads the list. */
async function toggleTool(name, currentlyOn, btn) {
  if (!state.selected) return;
  btn.disabled = true;
  var j = await apiJson("/api/mcps/" + encodeURIComponent(state.selected) + "/tools/" + encodeURIComponent(name), {
    method: "POST",
    body: JSON.stringify({ enabled: !currentlyOn }),
  });
  btn.disabled = false;
  if (!j) return;
  if (j.unchanged) { toast("Already " + (currentlyOn ? "on" : "off")); return; }
  // Reload the tools page so the row moves between the enabled list and the disabled group.
  var d = state.detail;
  if (d) { d.tools.loaded = false; d.tools.cursors = []; void loadPage(d.name, "tools"); }
}

/** Read one resource and show its contents. Read-only, so a sheet with no form is the whole UI. */
async function readResource(uri, btn) {
  if (!state.selected) return;
  var label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  var j = await apiJson("/api/mcps/" + encodeURIComponent(state.selected) + "/resource", {
    method: "POST",
    body: JSON.stringify({ uri: uri }),
  });
  if (btn) { btn.disabled = false; btn.textContent = label || "Read"; }
  if (!j) return;
  $("sheet").innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="Resource contents">' +
      '<div class="sheet-head"><h2>' + esc(uri) + "</h2></div>" +
      '<div class="sheet-body"><div class="note">' +
        (j.ok ? esc((j.mimeType || "text/plain") + " · " + j.ms + " ms") : '<span style="color:var(--red)">read failed</span>') +
      "</div>" +
      '<pre class="logs" style="max-height:60vh">' + esc(j.text || "") + "</pre></div>" +
      '<div class="sheet-foot"><button class="btn" id="rd-close">Close</button></div>' +
    "</div>";
  $("sheet").hidden = false;
  $("rd-close").onclick = closeSheet;
  $("sheet").onclick = function (e) { if (e.target === $("sheet")) closeSheet(); };
}

/** Repaint only the Logs tab body, so a poll doesn't rebuild the pane (or the header, or the menu).
 *  Expanded rows survive because `callsOpen` is state, not DOM. */
function renderCallsOnly() {
  var d = state.detail;
  if (!d || d.tab !== "logs") return;
  var body = $("tabbody");
  if (!body) return;
  // Repaint only when the log actually changed — otherwise a 6 s poll would scroll an open result
  // back to the top while it is being read.
  var calls = d.calls || [];
  var sig = (calls.length ? calls[0].seq : 0) + ":" + calls.length + ":" + d.stderr.length;
  if (body.dataset.callsig === sig) return;
  body.innerHTML = logsBody(d);
  body.dataset.callsig = sig;
  wireTabBody(d, rowOf(d.name) || {});
}

/* --- polling ---------------------------------------------------------------------------------- */
async function loadList() {
  try {
    var r = await api("/api/mcps");
    if (!r.ok) { toast("HTTP " + r.status, true); return; }
    var j = await r.json();
    state.mcps = j.mcps || [];
    state.groups = j.groups || [];
    if (state.selected && !rowOf(state.selected)) { state.selected = null; state.detail = null; }
    patchSidebar();
    if (state.detail) patchDetailHead();
    else renderPane(); // empty state; nothing here can hold user input
  } catch (e) { /* handled */ }
}

async function loadMemory(tree) {
  try {
    var r = await api("/api/memory" + (tree ? "?tree=1" : ""));
    if (!r.ok) return;
    state.mem = await r.json();
    renderMemory();
  } catch (e) { /* handled */ }
}

function renderMemory() {
  var m = state.mem;
  if (!m) return;
  var chip = $("memChip");
  var total = m.childrenMb ? Math.round((m.gatewayMb + m.childrenMb) * 10) / 10 : m.gatewayMb;
  chip.textContent = total + " MB" + (m.processCount > 1 ? " · " + m.processCount + " procs" : "");
  chip.title = "gateway RSS " + m.gatewayMb + " MB (heap " + m.heapUsedMb + "/" + m.heapTotalMb +
    " MB, external " + m.externalMb + " MB)" +
    (m.childrenMb ? "\nproc-MCP children " + m.childrenMb + " MB across " + (m.processCount - 1) + " processes" : "") +
    (m.childrenPending ? "\nChild processes could not be measured — click to retry." : "");
  chip.className = "chip" + (m.childrenPending ? " button" : "");
  chip.onclick = m.childrenPending ? function () { loadMemory(true); } : null;
}

/* ================================================================================================
   Tunnels
   ------------------------------------------------------------------------------------------------
   Same rendering contract as the MCP side: renderTunnels() rebuilds the pane on an explicit action,
   and the 6s poll may only call patchTunnels(), which touches dots, state text, button labels and
   the footer. Every editable field lives in a sheet (#sheet, a separate subtree), so a poll can
   never wipe something being typed — but a poll that rebuilt the list would still steal focus from
   a keyboard user mid-tab, which is why patching exists at all.
   ================================================================================================ */

function tunData() { return state.tun.data || { connections: [], rules: [], mcps: [] }; }

function setView(v) {
  if (state.view === v) return;
  state.view = v;
  var seg = $("viewSeg");
  Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
    b.setAttribute("aria-selected", String(b.dataset.view === v));
  });
  // The sidebar is the MCP list; the tunnel view owns the whole width.
  document.querySelector(".sidebar").hidden = v === "tunnels" || v === "traffic";
  if (v === "tunnels") { loadTunnels(); }
  // Back to page one on entry: the ring keeps rolling while the view is closed, so the page you left
  // on may no longer exist — and a pager stranded past the end has no button back.
  else if (v === "traffic") { trafficReload(true); }
  else { renderPane(); patchSidebar(); }
  updateCountChip();
}

function updateCountChip() {
  var chip = $("countChip");
  if (state.view === "tunnels") {
    var d = tunData();
    var active = d.rules.filter(function (r) { return r.state === "up"; }).length;
    chip.textContent = d.rules.length + " rules · " + active + " active";
    return;
  }
  var up = state.mcps.filter(function (m) { return m.state === "up"; }).length;
  chip.textContent = state.mcps.length + " MCPs · " + up + " up";
}

/** `patchOnly` is what the poll passes: refresh the data, then patch rather than rebuild. */
async function loadTunnels(patchOnly) {
  var j = await apiJson("/api/tunnels");
  if (!j) return;
  state.tun.data = j;
  if (state.view === "tunnels") {
    if (patchOnly && $("pane").querySelector(".tun-foot")) patchTunnels();
    else renderTunnels();
  }
  updateCountChip();
}

function tunTab(t) {
  state.tun.tab = t;
  renderTunnels();
}

/** `18989 → 127.0.0.1:18989   via test-server · serves pg-app ●` */
function ruleSubHtml(r) {
  var out = esc(String(r.localPort)) + " &rarr; " + esc(r.targetHost + ":" + r.targetPort);
  out += ' <span class="via">via ' + esc(r.connectionName) + "</span>";
  if (r.mcpRows && r.mcpRows.length) {
    out += ' <span class="via">· serves </span>' + r.mcpRows.map(function (m) {
      return '<span class="serves' + (m.known ? "" : " unknown") + '" title="' +
        esc(m.known ? "MCP " + m.name + " is " + m.state : "no MCP named " + m.name) + '">' +
        esc(m.name) + '<span class="dot ' + esc(m.known ? m.state : "") + '"></span></span>';
    }).join(", ");
  }
  if (r.remark) out += ' <span class="via">· ' + esc(r.remark) + "</span>";
  return out;
}

function ruleRowHtml(r) {
  var busy = state.tun.busy[r.id];
  var running = r.state === "up" || r.state === "starting" || r.state === "reconnecting";
  // A held port is the one error with a remedy on the row itself.
  var force = r.portOwner
    ? '<button class="btn danger" data-free="' + esc(String(r.localPort)) + '">Force free</button>'
    : "";
  return '<div class="tun-row" data-rule="' + esc(r.id) + '">' +
      '<span class="dot ' + esc(busy ? "starting" : r.state) + '" data-dot></span>' +
      '<div class="tun-main">' +
        '<div class="tun-name">' + esc(r.name) + "</div>" +
        '<div class="tun-sub">' + ruleSubHtml(r) + "</div>" +
        (r.state === "error" || r.state === "reconnecting"
          ? '<div class="tun-err" data-reason>' + esc(r.reason || "") + "</div>" : "") +
      "</div>" +
      '<div class="tun-acts">' + force +
        '<button class="btn' + (running ? "" : " primary") + '" data-act="' + (running ? "stop" : "start") +
          '"' + (busy ? " disabled" : "") + ">" + (busy ? "…" : running ? "Stop" : "Start") + "</button>" +
        '<button class="btn" data-edit>Edit</button>' +
        '<button class="btn danger" data-del>Delete</button>' +
      "</div>" +
    "</div>";
}

function connRowHtml(c) {
  var busy = state.tun.busy[c.id];
  return '<div class="tun-row" data-conn="' + esc(c.id) + '">' +
      '<span class="dot ' + esc(busy ? "starting" : c.state === "connected" ? "up" : c.state) + '" data-dot></span>' +
      '<div class="tun-main">' +
        '<div class="tun-name">' + esc(c.name) + "</div>" +
        '<div class="tun-sub">' + esc(c.host + ":" + c.port) + ' <span class="via">· ' + esc(c.username) +
          " · " + esc(c.authType) + (c.ruleCount ? " · " + c.ruleCount + " rule" + (c.ruleCount === 1 ? "" : "s") : "") +
          "</span></div>" +
        (c.reason ? '<div class="tun-err" data-reason>' + esc(c.reason) + "</div>" : "") +
      "</div>" +
      '<div class="tun-acts">' +
        '<button class="btn" data-test' + (busy ? " disabled" : "") + ">" + (busy ? "…" : "Test") + "</button>" +
        '<button class="btn" data-edit>Edit</button>' +
        '<button class="btn danger" data-del>Delete</button>' +
      "</div>" +
    "</div>";
}

/* --- traffic: who (token + self-reported client) asked what, across every MCP -----------------
   Two sections: a "Clients" summary (who has been talking to the gateway, and which MCPs), and an
   "Activity" log underneath. The log defaults to "Actions" (tools/call, resources/read, …) so the
   protocol handshake stops drowning out the things you actually want to see. Click a client to filter
   the log to it.

   The gateway speaks stateless HTTP — there is no session table, so "clients" is folded from recorded
   interaction traffic: last-seen is the honest signal, and the in-memory buffer resets on restart. */
/** Identity for grouping: prefer the self-reported client name, fall back to the token, then anon.
 *  Mirrors clientKeyOf in traffic.ts — the server filters and folds by the same key. */
function clientKey(e) {
  if (e.clientName) return "n:" + e.clientName;
  if (e.client) return "t:" + e.client;
  return "?";
}
/** Relative "x ago"; refreshes every poll (6s) because renderTraffic re-runs while the view is open. */
function ago(iso) {
  var ms = Date.now() - new Date(iso).getTime();
  if (ms < 5000) return "just now";
  if (ms < 60000) return Math.round(ms / 1000) + "s ago";
  if (ms < 3600000) return Math.round(ms / 60000) + "m ago";
  return new Date(iso).toLocaleTimeString();
}

/**
 * Fetch one page of the activity log.
 *
 * Filtering, paging and the client fold all happen on the server now. They used to happen here, over
 * a 200-entry dump that carried every entry's raw request and reply (8 KB each) — up to megabytes on
 * a 6-second poll, to draw a dozen lines whose JSON was hidden behind a chevron. Two consequences to
 * keep in mind while reading the rest of this section: a row has no `.body`/`.response` until it is
 * expanded (see toggleTraffic), and `state.trafficClients` is the whole ring's fold, not this page's.
 */
async function loadTraffic() {
  var q = "/api/traffic?page=" + (state.trafficPage || 0) +
    (state.trafficFilter !== "all" ? "&actions=1" : "") +
    (state.trafficClient ? "&client=" + encodeURIComponent(state.trafficClient) : "");
  var j = await apiJson(q);
  if (!j) return;
  state.traffic = j.entries || [];
  state.trafficClients = j.clients || [];
  state.trafficTotal = j.total || 0;
  state.trafficAll = j.totalUnfiltered || 0;
  state.trafficMore = !!j.more;
  if (state.view !== "traffic") return;
  // Skip the rebuild when nothing changed: a 6s poll would otherwise collapse every expanded row and
  // reset scroll while you are reading one. Filter/refresh/view-entry call renderTraffic() directly.
  var sig = (state.traffic.length ? state.traffic[0].seq : 0) + ":" + state.traffic.length +
    ":" + state.trafficTotal + ":" + state.trafficClients.length;
  if (state.trafficSig === sig) return;
  state.trafficSig = sig;
  renderTraffic();
}

/** Re-query after anything that changes which rows the server should return. */
function trafficReload(resetPage) {
  if (resetPage) state.trafficPage = 0;
  state.trafficSig = null;
  void loadTraffic();
}
function trafficPageStep(delta) {
  var next = (state.trafficPage || 0) + delta;
  if (next < 0 || (delta > 0 && !state.trafficMore)) return;
  state.trafficPage = next;
  trafficReload(false);
}
function trafficRow(e) {
  var meta = (e.clientName ? e.clientName + (e.clientVersion ? " " + e.clientVersion : "") : "—") +
    "  ·  /" + e.mcp + "  ·  " + (e.ok ? "ok" : "err") + "  ·  " + e.ms + "ms  ·  " + new Date(e.at).toLocaleTimeString();
  // Collapsed: method + a one-line params preview + meta. Expanded (chevron): the raw request JSON.
  return '<div class="call' + (state.trafficOpen[e.seq] ? " open" : "") + '" data-tseq="' + e.seq + '">' +
    '<div class="call-sum" data-tog="' + e.seq + '" role="button" tabindex="0">' +
      '<span class="chev">&#8250;</span>' +
      '<span class="dot ' + (e.ok ? "up" : "down") + '"></span>' +
      '<span class="call-tool">' + esc(e.method) + "</span>" +
      '<span class="call-arg">' + esc(e.params || "") + "</span>" +
      '<span class="call-meta">' + esc(meta) + "</span>" +
    "</div>" +
    // Payload deliberately absent until the row is opened — trafficBodyHtml renders whatever
    // toggleTraffic has fetched. Building 200 hidden <pre> blocks (two fmtJson round-trips each) was
    // most of what this view cost, and none of it was on screen.
    '<div class="call-body">' + trafficBodyHtml(e) + "</div>" +
  "</div>";
}

function trafficBodyHtml(e) {
  var full = state.trafficFull[e.seq];
  if (!full) return '<div class="note"><span class="spin"></span> Loading…</div>';
  if (full.gone) return '<div class="note">This interaction has rolled out of the buffer.</div>';
  return '<div class="call-lbl">Request</div>' +
    '<pre class="logs">' + esc(fmtJson(full.body || "")) + "</pre>" +
    '<div class="call-lbl">Response' + (full.response ? "" : ' <span style="color:var(--text-3)">— none —</span>') + "</div>" +
    '<pre class="logs">' + (full.response ? esc(fmtJson(full.response)) : '<span style="color:var(--text-3)">no reply captured for this entry</span>') + "</pre>";
}

/** Fetch one interaction's raw request and reply, then paint it into the already-open row. */
async function loadTrafficBody(seq) {
  if (state.trafficFull[seq]) return;
  var j = await apiJson("/api/traffic/" + encodeURIComponent(seq));
  // A 404 means the ring rolled past it while the row sat there; say so rather than spin forever.
  state.trafficFull[seq] = j || { gone: true };
  var node = document.querySelector('#pane .call[data-tseq="' + seq + '"] .call-body');
  if (node) node.innerHTML = trafficBodyHtml({ seq: seq });
}
/** Expand/collapse one row's raw JSON in place — a poll must not close what you just opened. */
function toggleTraffic(seq) {
  state.trafficOpen[seq] = !state.trafficOpen[seq];
  var node = document.querySelector('#pane .call[data-tseq="' + seq + '"]');
  if (node) node.className = "call" + (state.trafficOpen[seq] ? " open" : "");
  if (state.trafficOpen[seq]) void loadTrafficBody(seq);
}
function renderTraffic() {
  // `entries` is one page; `clients`, `total` and `all` describe the whole ring (server-computed).
  var entries = state.traffic || [];
  var clients = state.trafficClients || [];
  var total = state.trafficTotal || 0;
  var all = state.trafficAll || 0;
  var sel = state.trafficClient;

  // Controls: action/everything toggle + clear. This whole pane is the Traffic view's content.
  var ctrl = '<div class="sec-head"><span class="sec-cap">Traffic</span>' +
    '<span style="display:flex;gap:var(--s2);align-items:center">' +
      '<div class="seg" id="trFilter">' +
        '<button data-filter="actions" aria-selected="' + (state.trafficFilter !== "all") + '">Actions</button>' +
        '<button data-filter="all" aria-selected="' + (state.trafficFilter === "all") + '">Everything</button>' +
      "</div>" +
      '<button class="btn" id="trClear"' + (all ? "" : " disabled") + ">" + (sel ? "Clear client" : "Clear") + "</button>" +
    "</span></div>";

  // Clients — who has been talking to the gateway, folded from recorded traffic (stateless: no live
  // connection to query). Click a row to filter the activity log to that client.
  var clientBlock;
  if (clients.length) {
    var rows = clients.map(function (c) {
      var isSel = sel === c.key;
      var mcps = (c.mcps || []).map(function (m) { return "/" + m; }).join("  ");
      var tokens = c.tokens || [];
      var tokenLine = tokens.length ? "token " + tokens.join(", ") : "no token";
      return '<div class="row row-act' + (isSel ? " row-sel" : "") + '" data-ckey="' + esc(c.key) + '" role="button" tabindex="0">' +
        '<div class="row-main">' +
          '<div class="name">' + esc(c.label) + "</div>" +
          '<div class="desc">' + esc(tokenLine) + " · " + esc(mcps) + " · " + esc(ago(c.lastAt)) +
          " · " + c.count + " request" + (c.count === 1 ? "" : "s") + "</div>" +
        "</div>" +
        (isSel ? '<button class="btn icon" data-cclr title="Stop filtering">&#10005;</button>' : "") +
      "</div>";
    }).join("");
    clientBlock = '<div class="cap" style="padding-top:var(--s5)">Clients · ' + clients.length + "</div>" +
      '<div class="group">' + rows + "</div>";
  } else {
    clientBlock = '<div class="cap" style="padding-top:var(--s5)">Clients</div>' +
      '<div class="group"><div class="row"><span class="rowmsg">No clients yet. When a client sends its first request (initialize, tools/list, …) it appears here with the MCPs it is using.</span></div></div>';
  }

  // Activity log — de-noised by the toggle, narrowed by a selected client.
  var actCap = "Activity · " + (state.trafficFilter === "all" ? "everything" : "actions only");
  var countTxt = total + (total !== all ? " of " + all : "") + " interactions";
  var actHead = '<div class="sec-head" style="padding-top:var(--s5)"><span class="sec-cap">' + esc(actCap) + "</span>" +
    '<span class="hint">' + esc(countTxt) + "</span></div>";
  var body;
  if (!all) {
    body = '<div class="group"><div class="row"><span class="rowmsg">No interactions yet. Every JSON-RPC request a client sends — initialize, tools/list, resources/read, tools/call — is recorded here; the clients above are summarized from it.</span></div></div>';
  } else if (!entries.length) {
    var hint = state.trafficPage
      ? "Nothing on this page."
      : sel
        ? "No activity for this client" + (state.trafficFilter !== "all" ? " in actions-only view." : ".")
        : (state.trafficFilter !== "all" ? "No actions yet — switch to Everything to see the protocol handshake." : "No interactions.");
    body = '<div class="group"><div class="row"><span class="rowmsg">' + esc(hint) + "</span></div></div>";
  } else {
    body = '<div class="group">' + entries.map(trafficRow).join("") + "</div>";
  }

  // Newer/Older, worded and shaped exactly like the tool-call log's pager — same direction, so
  // "Newer" always means toward the top of a newest-first list in both views.
  var pager = (state.trafficPage > 0 || state.trafficMore)
    ? '<div class="pager"><button class="btn" id="trPrev"' + (state.trafficPage > 0 ? "" : " disabled") + ">Newer</button>" +
      "<span>Page " + (state.trafficPage + 1) + "</span>" +
      '<button class="btn" id="trNext"' + (state.trafficMore ? "" : " disabled") + ">Older</button></div>"
    : "";

  // Wrapped in .wide: an interaction row is method + params + client + timing on one line, which the
  // standard measure cannot hold. Wiring below still queries from #pane, so the wrapper is invisible.
  $("pane").innerHTML = '<div class="wide">' + ctrl + clientBlock + actHead + body + pager + "</div>";

  // Every control below re-queries rather than re-filtering in place: the server owns the filter now,
  // so a page of "actions only for claude-code" can only come from asking for exactly that.
  $("trFilter").querySelectorAll("button").forEach(function (b) {
    b.onclick = function () { state.trafficFilter = b.dataset.filter; trafficReload(true); };
  });
  $("pane").querySelectorAll("[data-ckey]").forEach(function (row) {
    row.onclick = function () {
      state.trafficClient = state.trafficClient === row.dataset.ckey ? null : row.dataset.ckey;
      trafficReload(true);
    };
    row.onkeydown = function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); row.click(); } };
  });
  var tp = $("trPrev"); if (tp) tp.onclick = function () { trafficPageStep(-1); };
  var tn = $("trNext"); if (tn) tn.onclick = function () { trafficPageStep(1); };
  $("pane").querySelectorAll("[data-tog]").forEach(function (s) {
    s.onclick = function () { toggleTraffic(s.dataset.tog); };
    s.onkeydown = function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggleTraffic(s.dataset.tog); } };
  });
  var cclr = $("pane").querySelector("[data-cclr]");
  if (cclr) cclr.onclick = function (ev) { ev.stopPropagation(); state.trafficClient = null; trafficReload(true); };
  var clr = $("trClear");
  if (clr) clr.onclick = async function () {
    // Clear the selected client only when one is filtered ("Clear client"); otherwise clear all.
    var sel = state.trafficClient;
    var url = "/api/traffic" + (sel ? "?client=" + encodeURIComponent(sel) : "");
    var j = await apiJson(url, { method: "DELETE" });
    if (!j) return;
    state.trafficOpen = {};
    state.trafficFull = {};
    state.trafficClient = null; // the filtered client is gone (or we cleared all); drop the filter
    trafficReload(true);
  };
}

function renderTunnels() {
  var d = tunData();
  var isConns = state.tun.tab === "conns";
  var seg =
    '<div class="seg" role="tablist">' +
      '<button role="tab" data-tab="conns" aria-selected="' + isConns + '">SSH Connections</button>' +
      '<button role="tab" data-tab="rules" aria-selected="' + !isConns + '">Port Forwards</button>' +
    "</div>";
  var bar = isConns
    ? '<div class="tun-bar"><button class="btn primary" id="tNewConn">New</button></div>'
    : '<div class="tun-bar"><button class="btn primary" id="tNewRule">New</button>' +
      '<button class="btn" id="tStartAll">Start all</button>' +
      '<button class="btn" id="tStopAll">Stop all</button></div>';

  var body, foot;
  if (isConns) {
    body = d.connections.length
      ? '<div class="group">' + d.connections.map(connRowHtml).join("") + "</div>"
      : '<div class="empty"><div><h2>No SSH connections</h2><p class="hint">Add one with New, then point a forwarding rule at it.</p></div></div>';
    var connected = d.connections.filter(function (c) { return c.state === "connected"; }).length;
    foot = d.connections.length + " connection" + (d.connections.length === 1 ? "" : "s") + ", " + connected + " connected";
  } else {
    body = d.rules.length
      ? '<div class="group">' + d.rules.map(ruleRowHtml).join("") + "</div>"
      : '<div class="empty"><div><h2>No forwarding rules</h2><p class="hint">Add one with New. Each rule binds a local port and forwards it over SSH.</p></div></div>';
    var active = d.rules.filter(function (r) { return r.state === "up"; }).length;
    foot = d.rules.length + " rule" + (d.rules.length === 1 ? "" : "s") + ", " + active + " active";
  }

  // .wide for the same reason as the traffic log: a rule row is name + route + who it serves +
  // three buttons. .pane-desc keeps its own 60ch cap, so the prose does not stretch with it.
  $("pane").innerHTML = '<div class="wide">' +
    '<div class="pane-head"><div><h1 class="pane-title">Tunnels</h1>' +
      '<div class="pane-desc">SSH connections and the local ports forwarded over them. A local port stays bound only while its tunnel can carry traffic.</div>' +
    "</div></div>" + seg + bar + body + '<div class="tun-foot">' + esc(foot) + "</div>" +
  "</div>";
  wireTunnels();
}

/** Poll-safe update: dots, reasons, button labels and the footer. Never structure. */
function patchTunnels() {
  if (state.view !== "tunnels") return;
  var d = tunData();
  var rows = state.tun.tab === "conns" ? d.connections : d.rules;
  var attr = state.tun.tab === "conns" ? "data-conn" : "data-rule";
  var nodes = $("pane").querySelectorAll("[" + attr + "]");
  // A row appeared or vanished (another tab, or a reconnect that deleted nothing) — structure
  // changed, so a patch cannot express it.
  if (nodes.length !== rows.length) { renderTunnels(); return; }
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var node = $("pane").querySelector("[" + attr + '="' + (window.CSS && CSS.escape ? CSS.escape(row.id) : row.id) + '"]');
    if (!node) { renderTunnels(); return; }
    var busy = state.tun.busy[row.id];
    var dot = node.querySelector("[data-dot]");
    var live = state.tun.tab === "conns" ? (row.state === "connected" ? "up" : row.state) : row.state;
    if (dot) dot.className = "dot " + (busy ? "starting" : live);
    var reason = node.querySelector("[data-reason]");
    if (reason && reason.textContent !== (row.reason || "")) reason.textContent = row.reason || "";
    var act = node.querySelector("[data-act]");
    if (act) {
      var running = row.state === "up" || row.state === "starting" || row.state === "reconnecting";
      var label = busy ? "…" : running ? "Stop" : "Start";
      if (act.textContent !== label) {
        act.textContent = label;
        act.className = "btn" + (running ? "" : " primary");
        act.dataset.act = running ? "stop" : "start";
      }
      act.disabled = !!busy;
    }
  }
  var foot = $("pane").querySelector(".tun-foot");
  if (foot) {
    if (state.tun.tab === "conns") {
      var connected = d.connections.filter(function (c) { return c.state === "connected"; }).length;
      foot.textContent = d.connections.length + " connection" + (d.connections.length === 1 ? "" : "s") + ", " + connected + " connected";
    } else {
      var active = d.rules.filter(function (r) { return r.state === "up"; }).length;
      foot.textContent = d.rules.length + " rule" + (d.rules.length === 1 ? "" : "s") + ", " + active + " active";
    }
  }
}

function wireTunnels() {
  var pane = $("pane");
  Array.prototype.forEach.call(pane.querySelectorAll("[data-tab]"), function (b) {
    b.onclick = function () { tunTab(b.dataset.tab); };
  });
  if ($("tNewConn")) $("tNewConn").onclick = function () { openConnSheet(null); };
  if ($("tNewRule")) $("tNewRule").onclick = function () { openRuleSheet(null); };
  if ($("tStartAll")) $("tStartAll").onclick = startAllRules;
  if ($("tStopAll")) $("tStopAll").onclick = function () { stopAllRules(false); };

  Array.prototype.forEach.call(pane.querySelectorAll("[data-rule]"), function (node) {
    var id = node.dataset.rule;
    var rule = tunData().rules.filter(function (r) { return r.id === id; })[0];
    var act = node.querySelector("[data-act]");
    if (act) act.onclick = function () { ruleAct(id, act.dataset.act); };
    node.querySelector("[data-edit]").onclick = function () { openRuleSheet(rule); };
    node.querySelector("[data-del]").onclick = function () { deleteRule(rule, false); };
    var free = node.querySelector("[data-free]");
    if (free) free.onclick = function () { forceFreePort(Number(free.dataset.free), id); };
  });
  Array.prototype.forEach.call(pane.querySelectorAll("[data-conn]"), function (node) {
    var id = node.dataset.conn;
    var conn = tunData().connections.filter(function (c) { return c.id === id; })[0];
    node.querySelector("[data-test]").onclick = function () { testConn(id); };
    node.querySelector("[data-edit]").onclick = function () { openConnSheet(conn); };
    node.querySelector("[data-del]").onclick = function () { deleteConn(conn); };
  });
}

async function withTunBusy(id, verb, fn) {
  if (state.tun.busy[id]) return null;
  state.tun.busy[id] = verb;
  patchTunnels();
  try {
    return await fn();
  } finally {
    delete state.tun.busy[id];
    await loadTunnels();
  }
}

/* --- rule actions ----------------------------------------------------------------------------- */

async function ruleAct(id, verb) {
  await withTunBusy(id, verb, async function () {
    var r = await api("/api/tunnels/rules/" + encodeURIComponent(id) + "/" + verb, { method: "POST" });
    var j = await r.json().catch(function () { return {}; });
    // 409 means an MCP is using this tunnel. Tell the user who, then obey them.
    if (r.status === 409 && j.confirmRequired) {
      if (!confirm(j.dependents.join(", ") + " depend" + (j.dependents.length === 1 ? "s" : "") +
          " on this tunnel.\n\nStop it anyway?")) return;
      var forced = await apiJson("/api/tunnels/rules/" + encodeURIComponent(id) + "/stop?force=1", { method: "POST" });
      if (forced) toast("Stopped");
      return;
    }
    if (!r.ok) { toast(j.error || "HTTP " + r.status, true); return; }
    if (j.ok === false) { toast(j.error || "Start failed", true); return; }
    toast(verb === "start" ? "Started" : "Stopped");
  });
}

async function startAllRules() {
  var j = await apiJson("/api/tunnels/start-all", { method: "POST" });
  await loadTunnels();
  if (!j) return;
  var failed = (j.results || []).filter(function (x) { return !x.ok; });
  toast(failed.length
    ? (j.results.length - failed.length) + " started, " + failed.length + " failed: " + failed[0].name + " — " + failed[0].error
    : j.results.length + " tunnels started", failed.length > 0);
}

async function stopAllRules(force) {
  var r = await api("/api/tunnels/stop-all" + (force ? "?force=1" : ""), { method: "POST" });
  var j = await r.json().catch(function () { return {}; });
  if (r.status === 409 && j.confirmRequired) {
    if (!confirm("These MCPs are using tunnels you are about to stop:\n\n" + j.dependents.join(", ") +
        "\n\nStop them anyway?")) return;
    return stopAllRules(true);
  }
  await loadTunnels();
  if (!r.ok) { toast(j.error || "HTTP " + r.status, true); return; }
  toast((j.results || []).length + " tunnels stopped");
}

async function deleteRule(rule, force) {
  if (!force && !confirm('Delete forwarding rule "' + rule.name + '"?')) return;
  var r = await api("/api/tunnels/rules/" + encodeURIComponent(rule.id) + (force ? "?force=1" : ""), { method: "DELETE" });
  var j = await r.json().catch(function () { return {}; });
  if (r.status === 409 && j.confirmRequired) {
    if (!confirm(j.dependents.join(", ") + " depend on this tunnel.\n\nDelete it anyway?")) return;
    return deleteRule(rule, true);
  }
  await loadTunnels();
  if (!r.ok) { toast(j.error || "HTTP " + r.status, true); return; }
  toast("Deleted " + rule.name);
}

/** Kill whatever holds a local port. Confirmed here because it can kill a process doing real work. */
async function forceFreePort(port, ruleId) {
  var d = tunData();
  var rule = d.rules.filter(function (r) { return r.id === ruleId; })[0];
  var owner = rule && rule.portOwner;
  if (!confirm("Port " + port + " is held by pid " + (owner ? owner.pid + " (" + owner.name + ")" : "?") +
      ".\n\nForce-kill that process? It may be doing real work.")) return;
  var j = await apiJson("/api/tunnels/port/" + port + "/free", { method: "POST" });
  if (!j) { await loadTunnels(); return; }
  toast("Killed pid " + j.killed.pid + " (" + j.killed.name + ")");
  await ruleAct(ruleId, "start");
}

/* --- connection actions ------------------------------------------------------------------------ */

async function testConn(id) {
  await withTunBusy(id, "test", async function () {
    var j = await apiJson("/api/tunnels/connections/" + encodeURIComponent(id) + "/test", { method: "POST" });
    if (!j) return;
    if (j.ok) { toast("Connected in " + j.ms + " ms" + (j.banner ? " — " + j.banner : "")); return; }
    // A changed host key is the one failure with an action attached.
    if (j.kind === "hostkey" && j.fingerprint) {
      if (confirm(j.error + "\n\nTrust the new key?")) {
        var t = await apiJson("/api/tunnels/connections/" + encodeURIComponent(id) + "/trust", { method: "POST" });
        if (t) toast("Host key trusted — test again");
      }
      return;
    }
    toast(j.error + " (" + j.kind + ")", true);
  });
}

async function deleteConn(conn) {
  if (!confirm('Delete SSH connection "' + conn.name + '"?')) return;
  var j = await apiJson("/api/tunnels/connections/" + encodeURIComponent(conn.id), { method: "DELETE" });
  await loadTunnels();
  if (j) toast("Deleted " + conn.name);
}

/* --- connection sheet -------------------------------------------------------------------------- */

async function loadKeys() {
  if (state.tun.keys) return state.tun.keys;
  var j = await apiJson("/api/tunnels/keys");
  state.tun.keys = j || { keys: [], defaultPath: "" };
  return state.tun.keys;
}

function openConnSheet(def) {
  var editing = !!def;
  var d = def || { name: "", host: "", port: 22, username: "", authType: "key", keyPath: "", passphrase: "", password: "" };
