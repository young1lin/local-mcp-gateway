<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MCP Gateway</title>
  <style>
    /* ---------------------------------------------------------------------------------------------
       Structure over palette. This is the shape Apple uses for a management UI (System Settings):
       sidebar + detail pane, grouped inset lists, one primary action with the rest behind an overflow
       menu, a strict type ramp and a 4pt spacing grid.

       Three rules the previous pass got wrong, and this one enforces:

       1. MONOSPACE IS FOR VALUES YOU WOULD COPY — an endpoint path, a tool name, a JSON payload.
          Never for identity. A 26px monospace pane title is the single loudest tell that a UI is
          imitating Apple rather than following it; the title is now sans, and the mount path moved
          into the status line where a monospace face is earned.

       2. SATURATION IS FOR STATE. Status dots, the accent, and error red stay loud. Launch-method
          tags (http / npx / uvx / …) get a quiet hue each so a scan of the list can tell them
          apart — tinted chips, not outlined badges.

       3. TEXT NEEDS A MEASURE. Cards used to stretch to the window's full width, which made a single
          tool card look lost in a 1500px field. Content is capped at --measure; the log and traffic
          views, whose rows are genuinely wide, get --measure-wide. Neither is ever unbounded.

       Font note: this gateway runs on Windows, where the SF stack falls through to Segoe UI. Tracking
       is neutral except on the one size large enough to want it, and Inter is honored first if it is
       ever installed.
    --------------------------------------------------------------------------------------------- */
    :root {
      /* Set from <head> before first paint, and re-resolved whenever the picker or the OS changes.
         What lands here is always a concrete light/dark — "auto" is resolved in JS — so the dark
         palette is written once, below, instead of once for the media query and again for the
         picker with the two free to drift apart. */
      color-scheme: light;

      /* Type ramp — five roles, nothing in between. */
      --f-title: 22px;      /* pane title */
      --f-head: 15px;       /* pane description, sheet heading */
      --f-body: 13px;       /* default */
      --f-label: 12px;      /* secondary text */
      --f-caption: 11px;    /* group captions, uppercase */

      /* 4pt spacing grid. */
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;

      /* Content measure. Nothing in the pane is ever full-bleed. */
      --measure: 820px;
      --measure-wide: 1180px;

      --r-card: 10px;
      --r-row: 6px;
      --r-btn: 6px;
      --r-pill: 980px;

      --sans: Inter, "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;

      /* Light. Cards are off-white and the canvas sits a step below what it was: a full-height wall
         of #fff beside a near-white canvas is where the glare came from, and taking both down a
         notch keeps the same card/canvas separation with less of it. The status colours are the
         darker, less fluorescent members of their Apple pairs for the same reason — a column of
         nine saturated green pills is a lot of light for what is only a row control. */
      --bg: #ececf1;
      --sidebar: #e3e3ea;
      --card: #fbfbfd;
      --text: #1d1d1f;
      --text-2: #6b6b70;
      --text-3: #96969b;
      --sep: rgba(0, 0, 0, 0.09);
      --sep-soft: rgba(0, 0, 0, 0.055);
      --hover: rgba(0, 0, 0, 0.045);
      --accent: #0069d9;
      --accent-text: #ffffff;
      --green: #248a3d;
      --red: #d70015;
      --amber: #b25000;
      --shadow-sheet: 0 24px 60px rgba(0, 0, 0, 0.22);
      --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.16);
    }
    /* Dark. Written once; `data-theme` is always resolved before it reaches the DOM. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --sidebar: #252527;
      --card: #2c2c2e;
      --text: #f2f2f7;
      --text-2: #9b9ba0;
      --text-3: #6e6e73;
      --sep: rgba(255, 255, 255, 0.1);
      --sep-soft: rgba(255, 255, 255, 0.06);
      --hover: rgba(255, 255, 255, 0.06);
      --accent: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --amber: #ffd60a;
      --shadow-sheet: 0 24px 60px rgba(0, 0, 0, 0.6);
      --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      font-size: var(--f-body);
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }
    code { font-family: var(--mono); font-size: 0.92em; }

    /* --- controls ------------------------------------------------------------------------------ */
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    /* A push button, not a pill: macOS reserves the full-round shape for toolbar segments and tags.
       These are "Start", "Try", "Read" — rounded rects. */
    .btn {
      font-size: var(--f-body); font-weight: 500;
      padding: 4px var(--s3); border-radius: var(--r-btn);
      background: var(--card); color: var(--text);
      box-shadow: inset 0 0 0 1px var(--sep);
      transition: background .12s ease;
      white-space: nowrap;
    }
    .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; font-weight: 550; }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
    .btn.danger { color: var(--red); }
    .btn:disabled, .btn.disabled { opacity: .4; cursor: default; background: var(--card); }

    /* A tool's visibility is a state you set, not an action you fire, so it is a switch — the control
       every row-level on/off in System Settings uses. It was an outlined uppercase "ON" pill, and a
       column of nine of those read as nine status badges arguing with the sidebar's status dots
       instead of as nine controls. A <button role="switch"> rather than a checkbox, so a row stays
       one HTML string and keeps the same disabled/reload handling as every other row button. */
    .sw {
      flex: none; width: 38px; height: 22px; border-radius: var(--r-pill); position: relative;
      background: var(--sep); box-shadow: inset 0 0 0 1px var(--sep-soft);
      transition: background .15s ease;
    }
    .sw::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .28);
      transition: transform .15s ease;
    }
    /* Accent, not green: green already means "this MCP is up" on every sidebar row, and a switch is
       not a health reading. macOS switches are the accent colour for exactly this reason. */
    .sw[aria-checked="true"] { background: var(--accent); box-shadow: none; }
    .sw[aria-checked="true"]::after { transform: translateX(16px); }
    .sw:disabled { opacity: .4; cursor: default; }
    @media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }
    .row.muted .name { color: var(--text-3); }
    .group-cap { font-size: var(--f-caption); text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: var(--s4) var(--s4) var(--s1); }
    .btn.icon { padding: 4px 8px; font-size: 14px; line-height: 1; color: var(--text-2); }

    input, select, textarea {
      font: inherit; width: 100%;
      color: var(--text); background: var(--card);
      border: 1px solid var(--sep); border-radius: var(--r-row);
      padding: 5px var(--s2);
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    textarea { min-height: 62px; font-family: var(--mono); font-size: var(--f-label); resize: vertical; }
    select { appearance: none; padding-right: var(--s6); background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: right 13px center, right 8px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    label.field { display: block; }
    label.field > span { display: block; font-size: var(--f-label); color: var(--text-2); margin-bottom: var(--s1); }
    /* The one place colour marks something other than state: a required argument in Run. Leaving it
       out is the error the form is about to report, so it is the same red that reports it. */
    .req-star { color: var(--red); font-weight: 700; }
    label.check { display: flex; align-items: center; gap: var(--s2); font-size: var(--f-body); }
    label.check input { width: auto; accent-color: var(--accent); }

    /* --- shell --------------------------------------------------------------------------------- */
    /* A macOS toolbar has no row of outlined pills. Its items are borderless until you point at them,
       and its readouts are plain text — so .btn and .chip both shed their chrome in here. */
    .toolbar {
      height: 44px; display: flex; align-items: center; gap: var(--s3);
      padding: 0 var(--s3) 0 var(--s4);
      background: var(--sidebar);
      border-bottom: 1px solid var(--sep);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-size: var(--f-body); font-weight: 600; }
    .grow { flex: 1; }
    .toolbar .btn {
      background: none; box-shadow: none; color: var(--text-2); font-weight: 450;
    }
    .toolbar .btn:hover { background: var(--hover); color: var(--text); }
    .chip {
      font-size: var(--f-label); font-variant-numeric: tabular-nums;
      color: var(--text-3); background: none;
      padding: 2px var(--s1); border-radius: var(--r-btn); white-space: nowrap;
    }
    .chip.button:hover { background: var(--hover); color: var(--text-2); cursor: pointer; }

    .shell { display: flex; height: calc(100vh - 44px); }

    /* --- sidebar ------------------------------------------------------------------------------- */
    .sidebar {
      width: 248px; flex: none; display: flex; flex-direction: column;
      background: var(--sidebar); border-right: 1px solid var(--sep);
    }
    .side-head { display: flex; gap: var(--s1); padding: var(--s2) var(--s2) var(--s1); }
    .side-head input { background: var(--card); }
    .side-head .btn { background: none; box-shadow: none; }
    .side-cap {
      font-size: var(--f-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-3); padding: var(--s2) var(--s3) var(--s1);
    }
    .side-list { flex: 1; overflow-y: auto; padding: 0 var(--s2) var(--s4); }
    /* One line per row, like every Apple source list. The previous two-line row carried a truncated
       description, so all eleven rows ended in an ellipsis and the list read as a ragged wall — the
       description said less than the name it sat under. It is still one hover away (the row's title)
       and is set in full in the pane header. What earns the trailing slot instead is the launch
       method (http / npx / uvx / ...), which is short, uniform, and the thing you actually scan for. */
    .side-row {
      display: flex; align-items: center; gap: var(--s2);
      width: 100%; height: 32px; flex: none; text-align: left;
      padding: 0 var(--s2); border-radius: var(--r-row);
      color: var(--text);
    }
    .side-row:hover { background: var(--hover); }
    /* Tinted, not a solid blue slab: every row carries a semantic status dot (green / red / amber),
       and those wash out against a saturated fill. State has to survive selection. */
    .side-row[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .side-row[aria-selected="true"] .side-name { color: var(--accent); font-weight: 590; }
    /* Drag-to-reorder: the insertion point, shown on the row the payload would land beside. */
    .side-row.dragging { opacity: 0.55; }
    .side-row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
    .side-row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
    .side-name {
      flex: 1; min-width: 0; font-size: var(--f-body); font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* How this MCP is launched. A quiet hue per method — readable, not a status badge. */
    .side-type {
      flex: none; font-family: var(--mono); font-size: var(--f-caption); font-weight: 550;
      white-space: nowrap; padding: 1px 6px; border-radius: 5px;
      color: var(--tag-fg, var(--text-2)); background: var(--tag-bg, var(--sep-soft));
    }
    .side-type[data-tag="http"]   { --tag-fg: #0369a1; --tag-bg: rgba(3, 105, 161, 0.12); }
    .side-type[data-tag="rest"]   { --tag-fg: #5b21b6; --tag-bg: rgba(91, 33, 182, 0.12); }
    .side-type[data-tag="npx"]    { --tag-fg: #c2410c; --tag-bg: rgba(194, 65, 12, 0.12); }
    .side-type[data-tag="uvx"]    { --tag-fg: #0f766e; --tag-bg: rgba(15, 118, 110, 0.12); }
    .side-type[data-tag="docker"] { --tag-fg: #075985; --tag-bg: rgba(7, 89, 133, 0.12); }
    .side-type[data-tag="echo"]   { --tag-fg: #3f6212; --tag-bg: rgba(63, 98, 18, 0.12); }
    .side-type[data-tag="mysql"]  { --tag-fg: #b45309; --tag-bg: rgba(180, 83, 9, 0.12); }
    .side-type[data-tag="pg"]     { --tag-fg: #1d4ed8; --tag-bg: rgba(29, 78, 216, 0.12); }
    .side-type[data-tag="redis"]  { --tag-fg: #b91c1c; --tag-bg: rgba(185, 28, 28, 0.12); }
    .side-type[data-tag="mongo"]  { --tag-fg: #15803d; --tag-bg: rgba(21, 128, 61, 0.12); }
    .side-type[data-tag="proc"]   { --tag-fg: #44403c; --tag-bg: rgba(68, 64, 60, 0.10); }
    :root[data-theme="dark"] .side-type[data-tag="http"]   { --tag-fg: #7dd3fc; --tag-bg: rgba(14, 165, 233, 0.18); }
    :root[data-theme="dark"] .side-type[data-tag="rest"]   { --tag-fg: #c4b5fd; --tag-bg: rgba(139, 92, 246, 0.20); }
    :root[data-theme="dark"] .side-type[data-tag="npx"]    { --tag-fg: #fdba74; --tag-bg: rgba(234, 88, 12, 0.20); }
    :root[data-theme="dark"] .side-type[data-tag="uvx"]    { --tag-fg: #5eead4; --tag-bg: rgba(20, 184, 166, 0.18); }
    :root[data-theme="dark"] .side-type[data-tag="docker"] { --tag-fg: #7dd3fc; --tag-bg: rgba(2, 132, 199, 0.20); }
    :root[data-theme="dark"] .side-type[data-tag="echo"]   { --tag-fg: #bef264; --tag-bg: rgba(101, 163, 13, 0.18); }
    :root[data-theme="dark"] .side-type[data-tag="mysql"]  { --tag-fg: #fbbf24; --tag-bg: rgba(217, 119, 6, 0.20); }
    :root[data-theme="dark"] .side-type[data-tag="pg"]     { --tag-fg: #93c5fd; --tag-bg: rgba(59, 130, 246, 0.20); }
    :root[data-theme="dark"] .side-type[data-tag="redis"]  { --tag-fg: #fca5a5; --tag-bg: rgba(239, 68, 68, 0.20); }
    :root[data-theme="dark"] .side-type[data-tag="mongo"]  { --tag-fg: #86efac; --tag-bg: rgba(34, 197, 94, 0.18); }
    :root[data-theme="dark"] .side-type[data-tag="proc"]   { --tag-fg: #d6d3d1; --tag-bg: rgba(168, 162, 158, 0.16); }

    /* --- sidebar groups -------------------------------------------------------------------------
       A disclosure header per group, in the source-list idiom: the header is a caption, not a row, so
       it never competes with the MCPs under it. `default` is always first and always present — it is
       where an MCP lives until you move it, and where the members of a deleted group land. */
    .side-group + .side-group { margin-top: var(--s2); }
    .grp-head { display: flex; align-items: center; border-radius: var(--r-row); }
    .grp-head:hover { background: var(--hover); }
    .grp-toggle {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s1);
      height: 24px; padding: 0 var(--s1); text-align: left;
      font-size: var(--f-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-3);
    }
    .grp-chev { flex: none; width: 10px; font-size: 10px; transition: transform .15s ease; }
    .side-group:not(.collapsed) .grp-chev { transform: rotate(90deg); }
    @media (prefers-reduced-motion: reduce) { .grp-chev { transition: none; } }
    .grp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grp-n { flex: none; font-variant-numeric: tabular-nums; font-weight: 500; opacity: .8; }
    .grp-add, .grp-more {
      flex: none; padding: 2px 6px; border-radius: 4px; line-height: 1;
      font-size: 13px; color: var(--text-3);
    }
    /* Adding an MCP is the common act and it is always "into this group", so + stays visible — dimmed
       until you point at the header. The rename/delete ⋯ is rare, and appears only on hover: one
       persistent glyph per group is a hierarchy, two would be a toolbar. */
    .grp-add { opacity: .55; }
    .grp-more { opacity: 0; }
    .grp-head:hover .grp-add, .grp-head:hover .grp-more,
    .grp-add:focus-visible, .grp-more:focus-visible { opacity: 1; }
    .grp-add:hover, .grp-more:hover { color: var(--text); background: var(--sep-soft); }
    .grp-more.spacer { visibility: hidden; pointer-events: none; }
    .side-group.collapsed .grp-rows { display: none; }
    /* The indent is what makes this read as a tree: a row's content starts under its group's NAME,
       past the disclosure triangle, and its hover/selection fill indents with it. */
    .grp-rows { padding-left: 12px; }
    /* Dropping onto the header itself appends to that group, which is the only way to reach an
       empty one. */
    .grp-head.drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); }

    /* Status is a dot plus neutral text — color is reserved for interaction, not for body copy. */
    .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text-3); }
    .dot.up { background: var(--green); }
    .dot.down, .dot.error { background: var(--red); }
    .dot.idle { background: var(--accent); } /* a lazy proc: no child spawned, starts on first request */
    .dot.starting, .dot.stopping { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }

    /* --- detail pane --------------------------------------------------------------------------- */
    .pane { flex: 1; overflow-y: auto; padding: var(--s6) var(--s8) var(--s8); }
    /* The measure. Every top-level block in the pane is capped, so one tool card reads as a card and
       not as a stripe across a 2560px monitor. `.wide` is the opt-out for content whose rows are
       genuinely wide (the call log, the traffic log, the tunnel table) — still capped, just further. */
    /* Centred, not left-hugging. Capped at 820px against a 1263px pane, a left-aligned column leaves
       ~400px of empty canvas stacked down one side — the content looks pushed against the sidebar
       rather than laid out. System Settings centres its column for the same reason. */
    .pane > * { max-width: var(--measure); margin-inline: auto; }
    .pane > .wide { max-width: var(--measure-wide); }
    .pane > .empty { max-width: none; }

    .pane-head { display: flex; align-items: flex-start; gap: var(--s4); margin-bottom: var(--s5); }
    .pane-title { font-size: var(--f-title); font-weight: 600; letter-spacing: -0.012em; margin: 0; }
    .pane-desc { font-size: var(--f-head); font-weight: 400; color: var(--text-2); margin-top: 3px; max-width: 60ch; }
    .pane-sub { display: flex; align-items: center; gap: var(--s2); font-size: var(--f-label); color: var(--text-2); margin-top: var(--s2); }
    /* The mount path — the one part of the header you would actually copy, so it keeps the monospace
       face the title gave up. */
    .sub-path { font-family: var(--mono); font-size: var(--f-caption); color: var(--text-2); }
    .sub-path::after { content: "·"; color: var(--text-3); margin-left: var(--s2); }
    .pane-actions { margin-left: auto; display: flex; gap: var(--s2); position: relative; }

    /* height:100% resolves against .pane when this is a direct child; min-height carries it when the
       tunnel view nests it inside a .wide wrapper. */
    .empty { height: 100%; min-height: 320px; display: grid; place-items: center; text-align: center; color: var(--text-3); }
    .empty h2 { font-size: var(--f-head); font-weight: 550; color: var(--text-2); margin: 0 0 var(--s1); }

    /* Segmented control. */
    .seg { display: inline-flex; gap: 2px; padding: 2px; margin-bottom: var(--s4); background: var(--sep-soft); border-radius: 8px; }
    .seg button { font-size: var(--f-body); font-weight: 500; color: var(--text-2); padding: 3px var(--s3); border-radius: 6px; }
    .seg button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 .5px 1.5px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.04); }
    /* A tab's item count. Glued straight onto the label ("Tools 1") it read as a typo; separated and
       dimmed, it reads as a count. */
    .seg-n { font-size: var(--f-caption); color: var(--text-3); font-variant-numeric: tabular-nums; margin-left: 5px; }
    .seg button[aria-selected="true"] .seg-n { color: var(--text-2); }

    /* Grouped inset list — hairlines, no drop shadow. */
    .group { background: var(--card); border: 1px solid var(--sep); border-radius: var(--r-card); overflow: hidden; }
    .group + .cap { margin-top: var(--s5); }
    .cap { font-size: var(--f-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: 0 var(--s1) var(--s2); }
    .row { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); align-items: baseline; }
    .row + .row { border-top: 1px solid var(--sep-soft); }
    /* A selected client row in the Traffic summary — narrows the activity log below to it. */
    .row.row-sel { background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .row .k { flex: none; width: 152px; color: var(--text-2); font-size: var(--f-label); }
    .row .v { flex: 1; min-width: 0; font-family: var(--mono); font-size: var(--f-label); word-break: break-word; }
    .row .v.wrap { white-space: pre-wrap; }
    /* An empty-state or error sentence filling a group row. It is prose, so it is set in the sans
       face — .v above is monospace because it holds a configured value. Every one of these used to
       reuse .v, which is why "No calls yet…" read like a config dump. */
    .rowmsg { flex: 1; min-width: 0; font-size: var(--f-body); color: var(--text-3); }
    .rowmsg.warn { color: var(--text-2); }
    .row-b { display: block; }
    .row-act { display: flex; align-items: flex-start; gap: var(--s3); }
    .row-act .row-main { flex: 1; min-width: 0; }
    .row-b .name, .row-act .name { font-family: var(--mono); font-weight: 550; word-break: break-all; }
    /* .row-act was missing from this rule, so a tool's description came out at full body size in full
       body colour — the same weight as the monospace name above it. Nine rows of two equally loud
       lines is why the list read as nine cards instead of nine rows. */
    .row-b .desc, .row-act .desc { color: var(--text-2); font-size: var(--f-label); margin-top: 2px; }
    /* A tool's argument names: one dimmed line under the description, truncated, never wrapped.
       They were a wrapping row of filled chips, which cost every row about 30px and read as loud as
       the name; then they were chips on the name's own line, which was worse — a tool with five
       arguments stretched a monospace bar the full width of the card and buried the name at the
       front of it. Neither earns a third weight in the row. The names are an annotation; Run holds
       the real signature, with types, descriptions and required markers. */
    .args {
      font-family: var(--mono); font-size: var(--f-caption); color: var(--text-3); line-height: 1.3;
      margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Required ones by weight and contrast, not by hue: red here would compete with the error red on
       a failed call two rows down, and "required" is not a failure. Run's red * is a form marker. */
    .args b { font-weight: 600; color: var(--text-2); }
    /* One-off label chip (the token list's "copies use this"). */
    .tag { font-family: var(--mono); font-size: var(--f-caption); color: var(--text-3); background: var(--sep-soft); padding: 1px 6px; border-radius: 5px; }

    .note { font-size: var(--f-label); color: var(--text-3); padding: var(--s3) var(--s1) 0; }
    /* A failure reason comes from the far side and can be enormous — a rejected JSON-RPC handshake
       arrives as a whole Zod error tree. Unbounded, it flooded the pane in red and buried the tab
       body above it. Contained, tinted and scrolled: still complete, no longer the loudest thing on
       the screen. */
    .note.err {
      color: var(--red); font-family: var(--mono); font-size: var(--f-caption);
      background: color-mix(in srgb, var(--red) 7%, transparent);
      border-radius: var(--r-row); padding: var(--s2) var(--s3); margin-top: var(--s3);
      max-height: 8.5em; overflow: auto; word-break: break-word;
    }
    pre.logs { margin: 0; padding: var(--s3) var(--s4); font-family: var(--mono); font-size: var(--f-caption); line-height: 1.5; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; }

    .pager { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s1) 0; font-size: var(--f-label); color: var(--text-2); }

    /* --- call log (Logs tab) ------------------------------------------------------------------- */
    /* center, not baseline: this header carries a segmented control and a button next to its caption,
       and a segmented control has no baseline to share. */
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 0 var(--s1) var(--s2); }
    .sec-cap { font-size: var(--f-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); }
    .call + .call { border-top: 1px solid var(--sep-soft); }
    .call-sum { display: flex; align-items: center; gap: var(--s2); width: 100%; text-align: left; padding: var(--s2) var(--s4); cursor: pointer; }
    .call-sum:hover { background: var(--hover); }
    .call-tool { font-family: var(--mono); font-weight: 550; font-size: var(--f-label); white-space: nowrap; }
    /* One line of the arguments in the summary — enough to recognize a query without opening it. */
    .call-arg { flex: 1; min-width: 0; font-family: var(--mono); font-size: var(--f-caption); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .call-meta { font-size: var(--f-caption); color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .call-body { display: none; padding: 0 var(--s4) var(--s3); }
    .call.open .call-body { display: block; }
    .call-lbl { font-size: var(--f-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: var(--s2) 0 var(--s1); }
    /* Formatted JSON needs room before it starts scrolling — this is the view you read a result in. */
    .call-body pre.logs { padding: var(--s2) var(--s3); background: var(--sep-soft); border-radius: 8px; max-height: 360px; }
    #runOut:not(:empty) { max-height: 480px; margin-top: var(--s2); background: var(--sep-soft); border-radius: 8px; }
    .call-body pre.logs.err { color: var(--red); }
    .chev { color: var(--text-3); font-size: 13px; width: 9px; flex: none; transition: transform .15s ease; }
    .call.open .chev { transform: rotate(90deg); }
    @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

    .form { padding: var(--s4); display: grid; gap: var(--s3); }
    .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
    .form-actions { display: flex; align-items: center; gap: var(--s3); padding-top: var(--s1); }
    /* Result status beside the Run button — never styled before, so it inherited 13px body text and
       sat at the same weight as the button's own label. */
    .run-meta { font-size: var(--f-label); color: var(--text-3); font-variant-numeric: tabular-nums; }

    /* Overflow menu. */
    .menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; min-width: 236px;
      background: var(--card); border: 1px solid var(--sep); border-radius: 10px;
      box-shadow: var(--shadow-pop); padding: var(--s1); display: grid;
    }
    /* The pane's overflow menu anchors to .pane-actions; a menu opened from the sidebar has no such
       anchor, so it is placed at the pointer instead. */
    .menu.float { position: fixed; top: auto; right: auto; min-width: 0; }
    .menu button { text-align: left; font-size: var(--f-body); padding: 5px var(--s2); border-radius: 6px; white-space: nowrap; }
    .menu button:hover { background: var(--hover); }
    .menu button.danger { color: var(--red); }
    /* A tick column, so the group list reads as "which one is it in" rather than a list of actions. */
    .menu button.pick { display: flex; align-items: center; gap: var(--s2); }
    .menu button.pick::before { content: "\2713"; width: 10px; flex: none; color: var(--accent); visibility: hidden; }
    .menu button.pick.on::before { visibility: visible; }
    .menu hr { border: 0; border-top: 1px solid var(--sep-soft); margin: var(--s1) 0; }
    /* A caption for the first group: "Copy Codex command" needs to say what it is for. */
    .menu-cap {
      font-size: var(--f-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-3); padding: var(--s1) var(--s2) 2px;
    }

    /* Sheet (Add) + sign-in. */
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: grid; place-items: start center; padding-top: 8vh; z-index: 40; }
    .sheet { width: min(560px, 92vw); background: var(--bg); border-radius: 14px; box-shadow: var(--shadow-sheet); overflow: hidden; }
    .sheet-head { display: flex; align-items: center; padding: var(--s4); border-bottom: 1px solid var(--sep); }
    .sheet-head h2 { font-size: var(--f-head); font-weight: 600; margin: 0; }
    .sheet-body { padding: var(--s4); display: grid; gap: var(--s3); max-height: 66vh; overflow-y: auto; }
    .sheet-foot { display: flex; justify-content: flex-end; gap: var(--s2); padding: var(--s3) var(--s4); border-top: 1px solid var(--sep); }
    .hint { font-size: var(--f-label); color: var(--text-3); }

    #gate { display: grid; place-items: center; height: 100vh; padding: var(--s4); }
    #gate .sheet { width: min(380px, 92vw); background: var(--card); }
    #gate .sheet-body { gap: var(--s4); }
    #gate h1 { font-size: var(--f-title); font-weight: 600; letter-spacing: -0.012em; margin: 0; }

    .toast {
      position: fixed; bottom: var(--s5); left: 50%; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--sep); border-radius: 10px;
      box-shadow: var(--shadow-pop); padding: var(--s2) var(--s4);
      font-size: var(--f-body); max-width: 78vw; z-index: 50;
    }
    .toast.err { border-color: var(--red); }
    .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--text-3); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- tunnels ------------------------------------------------------------------------------- */
    /* The list rows reuse .group/.dot/.btn; only the row layout is new. Deliberately not a table:
       the MCP side already establishes inset grouped lists as this panel's list idiom. */
    /* .seg's default bottom margin spaces it off the tab body. Where it sits inline beside other
       controls instead — the toolbar, a section header — that margin shifts it off their centre. */
    .toolbar .seg, .sec-head .seg { margin-bottom: 0; }
    .tun-bar { display: flex; gap: var(--s2); margin-bottom: var(--s4); }
    .tun-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); }
    .tun-row + .tun-row { border-top: 1px solid var(--sep-soft); }
    .tun-row:hover { background: var(--hover); }
    .tun-main { flex: 1; min-width: 0; }
    .tun-name { font-size: var(--f-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tun-sub { font-size: var(--f-label); color: var(--text-2); font-family: var(--mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tun-sub .via { font-family: var(--sans); }
    .tun-err { font-size: var(--f-label); color: var(--red); font-family: var(--mono); margin-top: 2px; }
    .tun-acts { display: flex; gap: var(--s2); flex: none; }
    .tun-foot { font-size: var(--f-label); color: var(--text-3); padding: var(--s3) var(--s1) 0; }
    /* An MCP the tunnel serves, with the MCP's own health dot: a red MCP beside a green tunnel says
       "the tunnel is fine, the database is not". */
    .serves { display: inline-flex; align-items: center; gap: 4px; font-family: var(--sans); }
    .serves .dot { width: 6px; height: 6px; }
    .serves.unknown { color: var(--text-3); text-decoration: line-through; }
    .keylist { display: grid; gap: 2px; max-height: 210px; overflow-y: auto; }
    .keylist button { text-align: left; font-family: var(--mono); font-size: var(--f-label); padding: 4px var(--s2); border-radius: 6px; }
    .keylist button:hover { background: var(--hover); }
    .mcp-picks { display: grid; gap: var(--s1); max-height: 168px; overflow-y: auto; padding: var(--s2); background: var(--card); border: 1px solid var(--sep); border-radius: 8px; }
    .with-btn { display: flex; gap: var(--s2); align-items: flex-end; }
    .with-btn > label { flex: 1; }
  </style>
  <script>
    /* Resolve the appearance before the first paint. Doing it in the main script instead means a
       full-brightness white panel flashes past on the way into the dark one, which is exactly what
       someone reaching for dark mode is trying to get away from. applyTheme() below repeats this;
       this copy exists only to beat the paint. */
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("mcp_gateway_theme") || "auto"; } catch (e) { /* blocked */ }
      var dark = pref === "dark" ||
        (pref !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
</head>
<body>

<div id="gate">
  <div class="sheet">
    <div class="sheet-body">
      <h1>MCP Gateway</h1>
      <label class="field"><span>Username</span><input id="user" value="admin" autocomplete="username"></label>
      <label class="field"><span>Password</span><input id="pass" type="password" value="admin" autocomplete="current-password"></label>
      <div id="gateErr" class="note err" hidden></div>
      <button class="btn primary" id="signIn">Sign In</button>
      <p class="hint">Defaults to <code>admin</code> / <code>admin</code>; override with <code>GATEWAY_USER</code> / <code>GATEWAY_PASS</code>.</p>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="toolbar">
    <span class="brand">MCP Gateway</span>
    <div class="seg" id="viewSeg" role="tablist" aria-label="Section">
      <button role="tab" data-view="mcps" aria-selected="true">MCPs</button>
      <button role="tab" data-view="traffic" aria-selected="false">Traffic</button>
      <button role="tab" data-view="tunnels" aria-selected="false">Tunnels</button>
    </div>
    <span class="chip" id="countChip"></span>
    <span class="grow"></span>
    <span class="chip" id="memChip" title="Gateway resident set">mem …</span>
    <button class="btn icon" id="refreshBtn" title="Refresh (r)">&#8635;</button>
    <button class="btn icon" id="themeBtn" title="Appearance" aria-label="Appearance">&#9681;</button>
    <button class="btn" id="tokenBtn" title="View, copy or rotate the gateway token">Token</button>
    <button class="btn" id="signOutBtn" title="Forget this browser's credentials">Sign Out</button>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-head">
        <input id="filter" type="search" placeholder="Search" aria-label="Filter MCPs">
        <button class="btn icon" id="addBtn" title="New group" aria-label="New group">+</button>
      </div>
      <div class="side-cap" id="sideCap">MCPs</div>
      <nav class="side-list" id="list" role="listbox" aria-label="Hosted MCPs"></nav>
    </aside>
    <main class="pane" id="pane"></main>
  </div>
</div>

<div id="sheet" class="backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ================================================================================================
   Rendering contract, and the reason this file is not one big innerHTML template any more:
   the old panel rebuilt the whole table from a string every 6 seconds, which flickered, dropped text
   selection and scroll position, and — a real bug — wiped whatever you had typed into the edit form.

   So: the 6s poll may ONLY patch the sidebar rows and the detail header (dot, subtitle, primary
   action). The tab body is rebuilt only in response to an explicit load or user action, never by the
   poll, and never while it holds focus.
   ================================================================================================ */

var AUTH_KEY = "mcp_gateway_auth";
var COLLAPSE_KEY = "mcp_gateway_collapsed";
var TOKEN_ID_KEY = "mcp_gateway_token_id"; // which token copied connect commands embed
var THEME_KEY = "mcp_gateway_theme";       // auto | light | dark — the preference, not the result
var KINDS = ["tools", "resources", "prompts"];
/* Mirrors DEFAULT_GROUP in managed.ts. Every MCP is in a group; this is the one it is in until you
   move it, and the one members of a deleted group fall back to. The server never stores it. */
var DEFAULT_GROUP = "default";

var state = {
  mcps: [],          // rows from /api/mcps (each carries .group)
  groups: [],        // custom group names, in sidebar order; `default` is implicit and comes first
  collapsed: {},     // group name -> true. Panel-only, so it lives in localStorage, not managed.json
  selected: null,    // selected MCP name
  filter: "",
  detail: null,      // { name, tab, config, source, editing, editType, tools:{...}, calls, ... }
  busy: {},          // name -> verb in flight
  lastAction: {},    // name -> { msg, err, at }
  mem: null,
  menuOpen: false,
  info: null,        // { tokenEnv } from /api/info — the env var name
  tokens: [],        // named tokens from /api/tokens (no secrets) — the management list
  activeSecret: null, // most-recently shown token secret, embedded into copied connect commands
  traffic: [],       // ONE PAGE of interactions from /api/traffic — no .body/.response on a row
  trafficClients: [],       // every client in the ring, folded server-side (not just this page)
  trafficFilter: "actions", // "actions" (tools/call, resources/read, …) or "all" (incl. protocol)
  trafficClient: null,      // a clientKey to narrow the activity log, or null
  trafficPage: 0,           // 0-based, newest first
  trafficMore: false,       // is there an older page?
  trafficTotal: 0,          // rows matching the current filter, across all pages
  trafficAll: 0,            // rows in the ring before filtering — the "n of m" readout
  trafficOpen: {},          // seq -> expanded: shows the raw request JSON for that interaction
  trafficFull: {},          // seq -> { body, response }, fetched on first expand (cf. d.callsFull)
  trafficSig: null,         // data signature; a poll skips re-render when unchanged (keeps expansion)
  view: "mcps",      // "mcps" | "tunnels" — the toolbar switcher
  tun: {             // tunnel view state; `data` is the last /api/tunnels response
    tab: "conns",    // "conns" | "rules"
    data: null,
    busy: {},        // id -> verb in flight
    keys: null,      // cached /api/tunnels/keys
  },
};

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function now() { return new Date().toLocaleTimeString(); }
function getAuth() { return localStorage.getItem(AUTH_KEY) || ""; }
function setAuth(v) { if (v) localStorage.setItem(AUTH_KEY, v); else localStorage.removeItem(AUTH_KEY); }

/** Which groups are folded shut. A view preference, not gateway state — it belongs to this browser. */
function loadCollapsed() {
  try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || {}; } catch (e) { return {}; }
}
function saveCollapsed() {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state.collapsed)); } catch (e) { /* full or blocked */ }
}

function toast(msg, isErr) {
  var t = $("toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.hidden = true; }, 3400);
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: getAuth(), "Content-Type": "application/json" }, opts.headers || {});
  var res = await fetch(path, opts);
  if (res.status === 401) { setAuth(""); showGate("Session expired — sign in again."); throw new Error("401"); }
  return res;
}

/** Call the API and hand back the parsed body, or null once the failure has been reported. Every
 *  mutation repeated the same fetch → parse → toast dance; a 401 is handled inside api() and shows
 *  the gate, arriving here as null too. */
async function apiJson(path, opts) {
  try {
    var r = await api(path, opts);
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) { toast(j.error || "HTTP " + r.status, true); return null; }
    return j;
  } catch (e) {
    return null;
  }
}

/* --- sign-in ---------------------------------------------------------------------------------- */
function showGate(msg) {
  $("app").hidden = true;
  $("gate").hidden = false;
  var e = $("gateErr");
  e.hidden = !msg;
  if (msg) e.textContent = msg;
  $("user").focus();
}
function showApp() {
  $("gate").hidden = true;
  $("app").hidden = false;
  loadList();
  loadInfo();
}

/** Gateway facts the panel needs once: the token's env var name, and the named-token list (no
 *  secrets) for the management view. */
async function loadInfo() {
  try {
    var r = await api("/api/info");
    if (r.ok) state.info = await r.json();
    var t = await api("/api/tokens");
    if (t.ok) state.tokens = (await t.json()).tokens || [];
  } catch (e) { /* the token list just stays empty */ }
}
$("signIn").onclick = async function () {
  var u = $("user").value, p = $("pass").value;
  try {
    var r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p }),
    });
    if (r.ok) { setAuth("Basic " + btoa(u + ":" + p)); showApp(); return; }
    var j = await r.json().catch(function () { return {}; });
    showGate(j.error || "Invalid credentials.");
  } catch (e) { showGate("Login request failed."); }
};
["user", "pass"].forEach(function (id) {
  $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") $("signIn").click(); });
});
$("signOutBtn").onclick = function () { setAuth(""); showGate(); };
$("tokenBtn").onclick = openTokensView;

/* --- appearance ------------------------------------------------------------------------------- */
/* Three choices, not a two-state switch: "auto" has to stay reachable, because on a machine that
   turns dark at sunset the right answer changes twice a day and a toggle can only ever be wrong
   half of it. The preference is per-browser (localStorage), not gateway state — it describes this
   screen, and the same gateway is read from other screens with other lighting. */
function themePref() {
  try { var v = localStorage.getItem(THEME_KEY); return v === "light" || v === "dark" ? v : "auto"; }
  catch (e) { return "auto"; }
}
function prefersDark() {
  return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme() {
  var p = themePref();
  document.documentElement.setAttribute("data-theme", p === "dark" || (p === "auto" && prefersDark()) ? "dark" : "light");
}
function setTheme(p) {
  try { if (p === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, p); }
  catch (e) { /* the choice still applies to this page load */ }
  applyTheme();
}
/* One click, one flip: the button shows what clicking switches TO — a moon on the light theme
   (click → dark), a sun on the dark one (click → light). "Auto" stays the untouched default (no
   stored preference): the first explicit click pins the choice for this browser. */
function paintThemeBtn() {
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  var b = $("themeBtn");
  b.innerHTML = dark ? "&#9728;" : "&#9790;"; // sun / moon
  b.title = dark ? "Switch to light" : "Switch to dark";
}
$("themeBtn").onclick = function (e) {
  e.stopPropagation();
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  setTheme(dark ? "light" : "dark");
  paintThemeBtn();
};
paintThemeBtn();
// Only matters while the preference is "auto"; a fixed choice is not the OS's business.
if (window.matchMedia) {
  var mq = matchMedia("(prefers-color-scheme: dark)");
  var onOsChange = function () { if (themePref() === "auto") { applyTheme(); paintThemeBtn(); } };
  if (mq.addEventListener) mq.addEventListener("change", onOsChange);
  else if (mq.addListener) mq.addListener(onOsChange);   // Safari < 14
}

/* --- field schemas ---------------------------------------------------------------------------- */
/* `description` leads every type: it is what the MCP client is told this endpoint is for, and with
   several instances of the same engine behind identical tool sets, it is the only thing that says
   which application's data is on the other end. */
var DESC_FIELD = {
  k: "description", label: "Description",
  ph: "What this MCP is for — e.g. IM service Redis, used by the chat backend",
  hint: "Describes the MCP itself. Sent to clients as the server's instructions, together with the connection target.",
};
/* "Start automatically at boot" — the user-facing side of the registry's `lazy` (inverted). A proc
   defaults OFF (its child is the one expensive idle thing here, so it starts on first request and
   is reaped when idle); every other type defaults ON. readFields returns it as `autostart`;
   submitAdd/saveEdit translate it to `lazy` before the server sees it. */
var AUTOSTART_PROC = {
  k: "autostart", label: "Start automatically at boot", bool: true, def: false,
  hint: "Off by default: the first client request spawns the child, and an idle one is reaped after 10 min (idleMs tunes). Adding it here still starts it now.",
};

function envToText(env) {
  return env ? Object.keys(env).map(function (k) { return k + "=" + env[k]; }).join("\n") : "";
}
function envToObj(text) {
  var o = {};
  String(text || "").split(/\r?\n/).forEach(function (line) {
    line = line.trim();
    if (!line || line.startsWith("#")) return;
    var i = line.indexOf("=");
    if (i < 0) return;
    o[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  return o;
}

/** Render one field. `p` prefixes element ids so the Add sheet and the inline editor can coexist. */
function fieldHtml(spec, val, p) {
  var id = p + spec.k;
  if (spec.bool) {
    var on = val === undefined ? !!spec.def : !!val && val !== "false";
    return '<div><label class="check"><input type="checkbox" id="' + id + '"' + (on ? " checked" : "") + '>' +
      esc(spec.label) + "</label>" + (spec.hint ? '<div class="hint">' + esc(spec.hint) + "</div>" : "") + "</div>";
  }
  /* `json` fields hold an authored structure (a rest MCP's tool declarations) rather than a value or a
     KEY=VALUE map, so they round-trip as pretty-printed JSON. */
  var v = val == null ? "" : spec.json ? JSON.stringify(val, null, 2) : (typeof val === "object" ? envToText(val) : String(val));
  // A password field is pre-filled with the mask sentinel, and the server keeps the stored secret
  // only while that sentinel comes back untouched. Password-manager autofill silently replacing it
  // would overwrite the real credential on save, with nothing to distinguish that from an edit.
  var fill = /pass|secret|token|key|url|credential/i.test(spec.k) ? ' autocomplete="off" spellcheck="false"' : "";
  var body = spec.area
    ? "<textarea id=\"" + id + '"' + fill + (spec.ph ? ' placeholder="' + esc(spec.ph) + '"' : "") + ">" + esc(v) + "</textarea>"
    : '<input type="text" id="' + id + '" value="' + esc(v) + '"' + fill + (spec.ph ? ' placeholder="' + esc(spec.ph) + '"' : "") + ">";
  return '<div><label class="field"><span>' + esc(spec.label) + "</span>" + body + "</label>" +
    (spec.hint ? '<div class="hint">' + esc(spec.hint) + "</div>" : "") + "</div>";
}

/** Lay a type's fields out, pairing the ones marked `half` into two columns. */
function fieldsHtml(type, vals, p) {
  var specs = TYPE_FIELDS[type] || [];
  var out = "", i = 0;
  while (i < specs.length) {
    if (specs[i].half && specs[i + 1] && specs[i + 1].half) {
      out += '<div class="two">' + fieldHtml(specs[i], vals && vals[specs[i].k], p) +
        fieldHtml(specs[i + 1], vals && vals[specs[i + 1].k], p) + "</div>";
      i += 2;
    } else {
      out += fieldHtml(specs[i], vals && vals[specs[i].k], p);
      i += 1;
    }
  }
  return out;
}

function readFields(type, p) {
  var o = {};
  (TYPE_FIELDS[type] || []).forEach(function (f) {
    var node = $(p + f.k);
    if (!node) return;
    if (f.bool) { o[f.k] = node.checked; return; }
    var raw = node.value;
    if (f.kv) { o[f.k] = envToObj(raw); return; }
    /* Malformed JSON is sent through as the raw string on purpose: the server answers with what is
       wrong with it, which is a better message than anything this form could invent. */
    if (f.json) { try { o[f.k] = JSON.parse(raw); } catch (e) { o[f.k] = raw; } return; }
    if (f.num) { if (raw !== "") o[f.k] = Number(raw); return; }
    if (raw !== "") o[f.k] = raw;
  });
  return o;
}

async function submitImport(input) {
  var f = input && input.files && input.files[0];
  if (!f) return;
  var text;
  try { text = await f.text(); } catch (e) { toast("Could not read file", true); return; }
  var json;
  try { json = JSON.parse(text); } catch (e) { toast("Not valid JSON", true); return; }
  var j = await apiJson("/api/mcps/import", { method: "POST", body: JSON.stringify(json) });
  if (!j) return;
  closeSheet();
  var n = (j.imported || []).length;
  var s = (j.skipped || []).length;
  toast("Imported " + n + (s ? ", skipped " + s : ""));

  await loadList();

async function submitAdd() {
  var type = $("a-type").value;
  var body = Object.assign({ name: $("a-name").value.trim(), type: type, enabled: $("a-start").checked }, readFields(type, "a-"));
  if (body.autostart !== undefined) { body.lazy = !body.autostart; delete body.autostart; }
  if (!body.name) { toast("Name is required", true); return; }
  if (type === "proc" && !body.command) { toast("Command is required", true); return; }
  var j = await apiJson("/api/mcps", { method: "POST", body: JSON.stringify(body) });
  if (!j) return;
  closeSheet();
  toast("Added " + body.name + " (" + (j.lifecycle || "stopped") + ")");
  state.selected = body.name;
  // Join the group whose + opened this sheet, BEFORE the list reload — so the row is drawn in its
  // group once, rather than appearing under `default` and hopping a moment later.
  if (state.addGroup && state.addGroup !== DEFAULT_GROUP) {
    await apiJson("/api/mcps/" + encodeURIComponent(body.name) + "/group",
      { method: "PUT", body: JSON.stringify({ group: state.addGroup }) });
  }
  await loadList();
  openDetail(body.name);
}

/** List, create, rotate and revoke named per-client tokens. A secret is shown ONCE on create/rotate. */

/** One `claude mcp add` line per MCP, embedding the given secret — a whole client setup in one copy. */
function connectAll(secret) {

async function refreshTokens() {
  var r = await api("/api/tokens");

function rememberedTokenId() {

/** Same rule as src/token.ts `pickCopyToken` — remembered id, else the `default` label, else first. */
function pickCopyToken(list, remembered) {
  if (!list.length) return null;
  if (remembered) {
    var hit = list.filter(function (t) { return t.id === remembered; })[0];
    if (hit) return hit;
  }
  return list.filter(function (t) { return t.label === "default"; })[0] || list[0] || null;
}

        '<p class="hint">One token per client. Copied connect commands use the <code>default</code> token unless you click Use. The Traffic tab attributes every request to its token, and to the name the client announces during initialize. A secret is shown once — on create or rotate.</p>' +
        '<div class="two"><input id="tkLabel" placeholder="label, e.g. claude-code">' +

/* --- lifecycle actions ------------------------------------------------------------------------ */
async function act(name, verb) {
  if (state.busy[name]) return;
  state.busy[name] = verb;
  patchSidebar(); patchDetailHead();
  try {
    var r = await api("/api/mcps/" + encodeURIComponent(name) + "/" + verb, { method: "POST" });
    var j = await r.json();
    if (!r.ok) {
      state.lastAction[name] = { msg: verb + " failed: " + (j.error || "HTTP " + r.status), err: true, at: now() };
      toast(name + ": " + (j.error || "failed"), true);
    } else {
      state.lastAction[name] = { msg: verb + " → " + (j.lifecycle || "ok"), err: false, at: now() };
      toast(name + ": " + state.lastAction[name].msg);
    }
  } catch (e) {
    state.lastAction[name] = { msg: verb + " request failed", err: true, at: now() };
  }
  delete state.busy[name];
  await loadList();
  // The server rebuilt on start/restart, so any cached page list is stale.
  if (state.detail && state.detail.name === name) {
    KINDS.forEach(function (k) { state.detail[k] = pageState(); });
    renderPane();
    loadMeta(name);
    if (KINDS.indexOf(state.detail.tab) >= 0) loadPage(name, state.detail.tab);
  }
}

async function renameMcp(name) {
  var next = prompt("Rename '" + name + "' to:", name);
  if (!next || next.trim() === name) return;
  next = next.trim();
  var ok = await apiJson("/api/mcps/" + encodeURIComponent(name) + "/rename", { method: "POST", body: JSON.stringify({ name: next }) });
  if (!ok) return;
  if (state.selected === name) state.selected = next;
  if (state.detail && state.detail.name === name) state.detail.name = next;
  toast("Renamed " + name + " → " + next);
  await loadList();
  renderPane();
}

async function removeMcp(name) {
  if (!confirm("Delete '" + name + "'?\n\nThis stops it and removes it permanently.")) return;
  var ok = await apiJson("/api/mcps/" + encodeURIComponent(name), { method: "DELETE" });
  if (!ok) return;
  if (state.selected === name) { state.selected = null; state.detail = null; }
  toast("Deleted " + name);
  await loadList();
  renderPane();
}

/* --- detail data ------------------------------------------------------------------------------ */
function pageState() {
  return { items: [], nextCursor: undefined, total: undefined, pageSize: 50, cursors: [""], loading: false, loaded: false, error: null };
}

function openDetail(name) {
  if (state.detail && state.detail.name === name) return;
  state.selected = name;
  var d = {
    name: name, tab: "tools", config: null, source: undefined, editing: false, editType: null, editVals: null,
    run: { tool: null, result: null, running: false },
    // Logs tab: a page of recorded tool calls (null until loaded), any child stderr, which rows are
    // expanded, and replies fetched in full by seq.
    calls: null, stderr: "", callsOpen: {}, callsLoading: false,
    callsPage: 0, callsMore: false, callsFull: {},
  };
  KINDS.forEach(function (k) { d[k] = pageState(); });
  state.detail = d;
  state.menuOpen = false;
  patchSidebar();
  renderPane();
  loadMeta(name);
  if (rowOf(name) && rowOf(name).lifecycle === "started") loadPage(name, "tools");
}

async function loadMeta(name) {
  // Compare the detail OBJECT, not its name: leaving an MCP and coming back builds a fresh detail
  // under the same name, and a slow response from the first visit would otherwise write into the
  // second one. loadPage already does it this way.
  var d = state.detail;
  try {
    var r = await api("/api/mcps/" + encodeURIComponent(name) + "/details");
    if (!r.ok) return;
    var j = await r.json();
    if (state.detail !== d) return;
    d.config = j.config || null;
    d.source = j.source;
    d.tunnels = j.tunnels || [];
    if (d.editing) return; // never rebuild a form the user is filling in
    if (d.tab === "config") renderPane();
  } catch (e) { /* handled */ }
}

/** One page of recorded tool calls (arguments + reply) and, for a proc MCP, its stderr. */
async function loadCalls(name) {
  var d = state.detail;
  if (!d || d.name !== name || d.callsLoading) return;
  d.callsLoading = true;
  try {
    var r = await api("/api/mcps/" + encodeURIComponent(name) + "/calls?page=" + d.callsPage);
    if (r.ok) {
      var j = await r.json();
      if (state.detail !== d) return; // a revisit built a new detail object — see loadMeta
      d.calls = j.calls || [];
      d.callsMore = !!j.more;
      d.stderr = j.stderr || "";
      renderCallsOnly();
    }
  } catch (e) { /* handled */ } finally {
    d.callsLoading = false; // this request's own flag, whatever the pane shows now
  }
}

function callsPageStep(delta) {
  var d = state.detail;
  if (!d) return;
  var next = d.callsPage + delta;
  if (next < 0 || (delta > 0 && !d.callsMore)) return;
  d.callsPage = next;
  d.calls = null; // show the loading state rather than the previous page's rows
  renderCallsOnly();
  loadCalls(d.name);
}

/** Fetch one reply in full — the log page ships only the first 2 KB of each. */
async function showFullResult(seq) {
  var d = state.detail;
  if (!d) return;
  try {
    var r = await api("/api/mcps/" + encodeURIComponent(d.name) + "/calls/" + encodeURIComponent(seq));
    if (!r.ok) { toast("HTTP " + r.status, true); return; }
    var j = await r.json();
    if (!state.detail || state.detail.name !== d.name || !j.call) return;
    if (j.call.bodyGone) {
      // Only the newest replies keep their payload; say which part is missing rather than showing a
      // short result as if it were whole.
      toast("The full reply is no longer stored — only the newest 50 per MCP are kept.", true);
      return;
    }
    d.callsFull[seq] = j.call.output;
    var pre = document.querySelector('#tabbody .call[data-seq="' + seq + '"] pre[data-out]');
    if (pre) pre.textContent = fmtJson(j.call.output);
    var btn = document.querySelector('#tabbody [data-full="' + seq + '"]');
    if (btn) btn.remove();
  } catch (e) { toast("request failed", true); }
}

async function clearCalls() {
  var d = state.detail;
  if (!d) return;
  try {
    var r = await api("/api/mcps/" + encodeURIComponent(d.name) + "/calls", { method: "DELETE" });
    if (!r.ok) { toast("HTTP " + r.status, true); return; }
    d.calls = [];
    d.callsOpen = {};
    d.callsFull = {};
    d.callsPage = 0;
    d.callsMore = false;
    renderCallsOnly();
  } catch (e) { toast("request failed", true); }
}

async function loadPage(name, kind) {
  var d = state.detail;
  if (!d || d.name !== name) return;
  var kd = d[kind];
  if (!kd || kd.loading) return;
  kd.loading = true;
  kd.error = null;
  if (d.tab === kind) renderPane();
  try {
    var cursor = kd.cursors[kd.cursors.length - 1];
    var url = "/api/mcps/" + encodeURIComponent(name) + "/" + kind + (cursor ? "?cursor=" + encodeURIComponent(cursor) : "");
    var r = await api(url);
    var j = await r.json().catch(function () { return {}; });
    if (r.ok) {
      kd.items = j[kind] || [];
      kd.nextCursor = j.nextCursor;
      kd.total = j.total;
      kd.pageSize = j.pageSize || kd.pageSize;
      kd.loaded = true;
      if (kind === "tools") kd.disabled = j.disabledTools || [];
      if (kind === "resources") kd.resourceEnabled = j.resourceEnabled !== false;
    } else {
      // Surface it instead of silently showing "none" — a direct adapter has no resources/prompts
      // capability at all, and that is worth saying out loud.
      kd.error = j.error || "HTTP " + r.status;
    }
  } catch (e) {
    kd.error = "request failed";
  }
  kd.loading = false;
  // Run builds its form from the tool list, so it also needs a repaint when tools land.
  if (state.detail === d && (d.tab === kind || (d.tab === "run" && kind === "tools"))) renderPane();
}

function showTab(tab) {
  var d = state.detail;
  if (!d) return;
  d.tab = tab;
  d.editing = false;
  renderPane();
  if (KINDS.indexOf(tab) >= 0 && !d[tab].loaded && !d[tab].loading) loadPage(d.name, tab);
  // Run needs the tool list to build its argument form.
  if (tab === "run" && !d.tools.loaded && !d.tools.loading) loadPage(d.name, "tools");
  if (tab === "logs") loadCalls(d.name);
}
function pageNext() {
  var d = state.detail, kd = d && d[d.tab];
  if (!kd || !kd.nextCursor || kd.loading) return;
  kd.cursors.push(kd.nextCursor);
  loadPage(d.name, d.tab);
}
function pagePrev() {
  var d = state.detail, kd = d && d[d.tab];
  if (!kd || kd.cursors.length <= 1 || kd.loading) return;
  kd.cursors.pop();
  loadPage(d.name, d.tab);
}

/* --- config edit ------------------------------------------------------------------------------ */
function startEdit() {
  var d = state.detail;
  if (!d || !d.config) return;
  d.editing = true;
  d.editType = d.config.type || "proc";
  d.editVals = null; // start from what is stored
  renderPane();
}
function cancelEdit() {
  if (!state.detail) return;
  state.detail.editing = false;
  state.detail.editType = null;
  state.detail.editVals = null;
  renderPane();
}
/** Switching type re-renders the form, so read what is in it first and carry it across — a field
 *  both types share (description, host, password) survives the switch. A masked secret carried into
 *  a type that never stored one is dropped server-side by unmaskBody, never saved as dots. */
function changeEditType(t) {
  var d = state.detail;
  if (!d) return;
  var prev = d.editType || (d.config && d.config.type) || "proc";
  d.editVals = Object.assign({}, d.editVals, readFields(prev, "e-"));
  d.editType = t;
  renderPane();
}

/**
 * Test connection — the DB types' form carries this beside Save. It POSTs the form's CURRENT
 * values (env refs intact) to /api/mcps/test, which expands them server-side and opens a real
 * driver connection with exactly these credentials — the same adapter and ping the health probe
 * uses. Nothing is saved: this is "will these values work", asked before committing them.
 */
async function runConnTest(p) {
  // p is the form's id prefix: "e-" for the inline editor, "a-" for the Add sheet.
  var d = state.detail;
  var type = p === "a-" ? $("a-type").value : (d && (d.editType || (d.config && d.config.type))) || "proc";
  var body = Object.assign({ type: type }, readFields(type, p));
  delete body.autostart; // a boot-time switch, not a credential — irrelevant to a connection test
  var btn = $(p + "test"), out = $(p + "test-out");
  if (!btn || !out) return;
  btn.disabled = true;
  btn.textContent = "Testing…";
  out.hidden = false;
  out.textContent = "connecting with these exact values — ${ENV} refs expand server-side…";
  out.style.color = "";
  try {
    var r = await api("/api/mcps/test", { method: "POST", body: JSON.stringify(body) });
    var j = await r.json();
    if (j.ok) {
      // For a rest target any HTTP answer is reachable — show which one came back (404 from the
      // base path is fine; the tools live under their own paths).
      out.textContent = "✓ connected — these values work (" + j.ms + " ms" + (j.status ? " · HTTP " + j.status : "") + ")";
      out.style.color = "var(--green)";
    } else {
      out.textContent = "✗ " + (j.error || "failed") + (j.ms != null ? " (" + j.ms + " ms)" : "");
      out.style.color = "var(--red)";
    }
  } catch (e) {
    out.textContent = "test request failed — is the gateway running?";
    out.style.color = "var(--red)";
  } finally {
    btn.disabled = false;
    btn.textContent = "Test connection";
  }
}

async function saveEdit() {
  var d = state.detail;
  if (!d) return;
  var type = d.editType || (d.config && d.config.type) || "proc";
  var fields = readFields(type, "e-");
  var body = Object.assign({ type: type }, fields);
  if (body.autostart !== undefined) { body.lazy = !body.autostart; delete body.autostart; }
  if (type === "proc" && !body.command) { toast("Command is required", true); return; }
  var name = d.name;
  // Rendering the pane destroys the form, so hold on to what was typed: a save the server rejects
  // used to cost the user the whole form, with nothing to do but reopen it and retype.
  var restore = function () {
    if (!state.detail || state.detail !== d) return;
    d.editing = true;
    d.editType = type;
    d.editVals = fields;
  };
  state.busy[name] = "save";
  d.editing = false;
  renderPane(); patchSidebar();
  try {
    var r = await api("/api/mcps/" + encodeURIComponent(name), { method: "PUT", body: JSON.stringify(body) });
    var j = await r.json();
    if (!r.ok) {
      state.lastAction[name] = { msg: "edit failed: " + (j.error || "HTTP " + r.status), err: true, at: now() };
      toast(j.error || "edit failed", true);
      restore();
    } else {
      state.lastAction[name] = { msg: "config saved → restarted", err: false, at: now() };
      toast(name + ": config saved, restarted");
      if (state.detail === d) d.editVals = null;
      KINDS.forEach(function (k) { if (state.detail) state.detail[k] = pageState(); });
      loadMeta(name);
    }
  } catch (e) {
    state.lastAction[name] = { msg: "edit request failed", err: true, at: now() };
    toast("edit request failed", true);
    restore();
  }
  delete state.busy[name];
  await loadList();
  renderPane();
}

/* --- rendering: sidebar ----------------------------------------------------------------------- */
function rowOf(name) {
  return state.mcps.find(function (m) { return m.name === name; });
}
function visibleMcps() {
  var f = state.filter.trim().toLowerCase();
  if (!f) return state.mcps;
  return state.mcps.filter(function (m) {
    return m.name.toLowerCase().indexOf(f) >= 0
      || String(m.type).toLowerCase().indexOf(f) >= 0
      || String(m.tag || "").toLowerCase().indexOf(f) >= 0 // "npx"/"uvx"/"http" finds a launch method
      || String(m.group || "").toLowerCase().indexOf(f) >= 0; // ...and a group name finds its members
  });
}

function groupOf(m) { return m && m.group ? m.group : DEFAULT_GROUP; }

/**
 * The sidebar's shape: `default` first, then the custom groups in their stored order, each holding
 * its members in the flat `order` the server already sorted by. One flat order sliced by group is
 * why moving an MCP between groups never has to rewrite the ordering.
 *
 * Empty groups keep their header — you have to be able to see a group you just made in order to drag
 * anything into it. A search is the one thing that hides a group, and only when nothing in it matches.
 */
function groupedMcps() {
  var rows = visibleMcps();
  var byGroup = {};
  rows.forEach(function (m) {
    var g = groupOf(m);
    (byGroup[g] = byGroup[g] || []).push(m);
  });
  var out = [{ name: DEFAULT_GROUP, rows: byGroup[DEFAULT_GROUP] || [] }];
  state.groups.forEach(function (g) { out.push({ name: g, rows: byGroup[g] || [] }); });
  if (state.filter.trim()) out = out.filter(function (g) { return g.rows.length; });
  return out;
}

/** Rows in the order the eye sees them: group by group, skipping what is folded shut. Arrow-key
 *  navigation follows this, not the flat list — otherwise Down would jump into a collapsed group. */
function navRows() {
  var out = [];
  groupedMcps().forEach(function (g) {
    if (!state.collapsed[g.name]) out = out.concat(g.rows);
  });
  return out;
}

/* --- sidebar drag-to-reorder ------------------------------------------------------------------ */

/** Persist the current list order. The server ranks /api/mcps by it and appends unknown names, so
 *  the panel and every other consumer agree on one order. */
function saveOrder() {
  api("/api/order", { method: "PUT", body: JSON.stringify({ order: state.mcps.map(function (m) { return m.name; }) }) })
    .catch(function () { /* the next reorder retries; the list is already right locally */ });
}

/** Move `name` to just before/after `target` in state.mcps, re-render, persist. Works on the FULL
 *  list (not the filtered view), so reordering with a search active does not shuffle the rest. */
function moveRow(name, target, before) {
  if (!name || !target || name === target) return;
  var item = state.mcps.find(function (m) { return m.name === name; });
  if (!item) return;
  state.mcps = state.mcps.filter(function (m) { return m.name !== name; });
  var to = state.mcps.findIndex(function (m) { return m.name === target; });
  if (to < 0) state.mcps.push(item); // target vanished mid-drag (deleted by a poll) — land at the end
  else state.mcps.splice(before ? to : to + 1, 0, item);
  patchSidebar();
  saveOrder();
}

/** Swap the selected MCP with its neighbour IN ITS OWN GROUP (Alt+Up / Alt+Down), then persist.
 *  Deliberately stops at the group edge: a keystroke that silently re-homed an MCP would be a
 *  surprise, and dragging is right there for that. */
function nudgeSelected(up) {
  var sel = rowOf(state.selected);
  if (!sel) return false;
  var g = groupOf(sel);
  var rows = visibleMcps().filter(function (m) { return groupOf(m) === g; });
  var i = rows.findIndex(function (m) { return m.name === state.selected; });
  var j = up ? i - 1 : i + 1;
  if (i < 0 || j < 0 || j >= rows.length) return false;
  var a = state.mcps.findIndex(function (m) { return m.name === rows[i].name; });
  var b = state.mcps.findIndex(function (m) { return m.name === rows[j].name; });
  var tmp = state.mcps[a]; state.mcps[a] = state.mcps[b]; state.mcps[b] = tmp;
  patchSidebar();
  saveOrder();
  return true;
}

/* --- sidebar groups --------------------------------------------------------------------------- */

/** One group: a disclosure header, then its rows. Built as nodes rather than an HTML string because
 *  a group name is user input and every handler here needs the name in a closure anyway. */
function groupNode(g) {
  var isDefault = g.name === DEFAULT_GROUP;
  var wrap = el("div", "side-group" + (state.collapsed[g.name] ? " collapsed" : ""));
  wrap.dataset.group = g.name;

  var head = el("div", "grp-head");
  var toggle = el("button", "grp-toggle");
  toggle.type = "button";
  toggle.appendChild(el("span", "grp-chev", "›"));
  toggle.appendChild(el("span", "grp-name", g.name));
  toggle.appendChild(el("span", "grp-n", String(g.rows.length)));
  toggle.onclick = function () {
    if (state.collapsed[g.name]) delete state.collapsed[g.name];
    else state.collapsed[g.name] = true;
    saveCollapsed();
    patchSidebar();
  };
  head.appendChild(toggle);

  // Adding an MCP lives on the group, not in the sidebar header: an MCP is always added INTO a
  // group, and doing it from here means the new one lands where you meant it to instead of appearing
  // in `default` to be dragged over afterwards.
  var add = el("button", "grp-add", "+");
  add.type = "button";
  add.title = "Add an MCP to " + g.name;
  add.setAttribute("aria-label", "Add an MCP to " + g.name);
  add.onclick = function (ev) { ev.stopPropagation(); openSheet(g.name); };
  head.appendChild(add);

  // `default` cannot be renamed or deleted: it is the fallback every other group's members land in,
  // so removing it would leave MCPs pointing at nothing.
  if (!isDefault) {
    var more = el("button", "grp-more", "···");
    more.type = "button";
    more.title = "Rename or delete this group";
    more.setAttribute("aria-label", "Group actions");
    more.onclick = function (ev) {
      ev.stopPropagation();
      popupMenu(more.getBoundingClientRect(), [
        { label: "Rename…", fn: function () { renameGroup(g.name); } },
        { sep: true },
        { label: "Delete group", danger: true, fn: function () { deleteGroup(g.name); } },
      ]);
    };
    head.appendChild(more);
  } else {
    // A reserved slot, not a button. Without it `default`'s + lands where every other group's ⋯ sits,
    // so the one glyph that is always visible jumps 20px sideways from one group header to the next.
    var pad = el("span", "grp-more spacer", "···");
    pad.setAttribute("aria-hidden", "true");
    head.appendChild(pad);
  }
  wireGroupDrop(head, g.name);
  wrap.appendChild(head);

  var body = el("div", "grp-rows");
  g.rows.forEach(function (m) {
    var b = el("button", "side-row");
    b.type = "button";
    b.dataset.name = m.name;
    b.setAttribute("role", "option");
    b.appendChild(el("span", "dot"));
    b.draggable = true; // reorder + regroup from the sidebar; see wireDrag
    b.appendChild(el("span", "side-name", m.name));
    b.appendChild(el("span", "side-type")); // http / rest / npx / uvx — filled by the patch pass
    b.onclick = function () { openDetail(m.name); };
    wireDrag(b);
    body.appendChild(b);
  });
  wrap.appendChild(body);
  return wrap;
}

/** Send the whole group list. Create, reorder and delete are all "here is the new list". */
async function saveGroups(next) {
  var j = await apiJson("/api/groups", { method: "PUT", body: JSON.stringify({ groups: next }) });
  if (!j) return false;
  state.groups = j.groups || [];
  await loadList();
  return true;
}

async function newGroup() {
  var name = prompt("New group name:", "");
  if (name === null) return;
  name = name.trim();
  if (!name) return;
  if (await saveGroups(state.groups.concat([name]))) toast("Group " + name + " created");
}

async function renameGroup(from) {
  var to = prompt("Rename group '" + from + "' to:", from);
  if (to === null || to.trim() === from) return;
  var j = await apiJson("/api/groups/" + encodeURIComponent(from) + "/rename",
    { method: "POST", body: JSON.stringify({ name: to.trim() }) });
  if (!j) return;
  state.groups = j.groups || [];
  // The fold state is keyed by name, so carry it across or a renamed group springs open.
  if (state.collapsed[from]) { delete state.collapsed[from]; state.collapsed[to.trim()] = true; saveCollapsed(); }
  await loadList();
  toast("Renamed " + from + " → " + to.trim());
}

async function deleteGroup(name) {
  var n = state.mcps.filter(function (m) { return groupOf(m) === name; }).length;
  // Deleting a group deletes nothing else, so this only has to say where the MCPs go.
  if (n && !confirm("Delete group '" + name + "'?\n\nIts " + n + " MCP" + (n === 1 ? "" : "s") +
      " move to '" + DEFAULT_GROUP + "'. Nothing is removed.")) return;
  if (await saveGroups(state.groups.filter(function (g) { return g !== name; }))) toast("Deleted group " + name);
}

/** Move one MCP into a group. Applied locally first so the row jumps immediately, then persisted. */
async function assignGroup(name, group) {
  var m = rowOf(name);
  if (!m || groupOf(m) === (group || DEFAULT_GROUP)) return;
  m.group = group || DEFAULT_GROUP;
  patchSidebar();
  var j = await apiJson("/api/mcps/" + encodeURIComponent(name) + "/group",
    { method: "PUT", body: JSON.stringify({ group: group }) });
  if (!j) { await loadList(); return; } // rejected — take the server's word for it
  m.group = j.group;
  patchSidebar();
}

/** A group header is a drop target too: it is the only way into a group with no rows yet. */
function wireGroupDrop(head, group) {
  head.addEventListener("dragover", function (e) {
    if (!state.dragging) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    head.classList.add("drop-into");
  });
  head.addEventListener("dragleave", function () { head.classList.remove("drop-into"); });
  head.addEventListener("drop", function (e) {
    e.preventDefault();
    head.classList.remove("drop-into");
    var name = state.dragging;
    state.dragging = null;
    if (name) dropInto(name, group);
  });
}

/** Land an MCP at the end of a group: reassign, then slot it after that group's last member so the
 *  flat order agrees with what the sidebar now shows. */
function dropInto(name, group) {
  var members = state.mcps.filter(function (m) { return groupOf(m) === group && m.name !== name; });
  if (members.length) moveRow(name, members[members.length - 1].name, false);
  assignGroup(name, group === DEFAULT_GROUP ? null : group);
}

/* --- a menu anchored to a button ---------------------------------------------------------------
   The pane's overflow menu anchors to .pane-actions; menus raised from the sidebar have no such
   anchor, so they are positioned against the button that opened them. Items are
   { label, fn, danger, sep }. */
function popupMenu(anchor, items) {
  closeMenu();
  var node = el("div", "menu float");
  node.id = "menu";
  items.forEach(function (it) {
    if (it.sep) { node.appendChild(document.createElement("hr")); return; }
    var cls = (it.pick ? "pick" : "") + (it.on ? " on" : "") + (it.danger ? " danger" : "");
    var b = el("button", cls.trim(), it.label);
    b.type = "button";
    b.onclick = function (ev) { ev.stopPropagation(); closeMenu(); it.fn(); };
    node.appendChild(b);
  });
  document.body.appendChild(node);
  // Aligned to the button's LEFT edge and growing right, over the detail pane. Right-aligning it
  // instead pushed a sidebar menu back across the list it was opened from, hiding those rows.
  var r = node.getBoundingClientRect();
  node.style.left = Math.max(8, Math.min(anchor.left, window.innerWidth - r.width - 8)) + "px";
  // Below the button, unless that would run off the bottom — then above it.
  var below = anchor.bottom + 4;
  node.style.top = (below + r.height > window.innerHeight - 8 ? Math.max(8, anchor.top - r.height - 4) : below) + "px";
  state.menuOpen = true;
}

/** Drag handlers for one sidebar row. The insertion point is the hovered row's half (top half =
 *  before it, bottom half = after it), shown as an accent edge. Dropping on a row in another group
 *  both moves the MCP there and places it at that spot. */
function wireDrag(row) {
  row.addEventListener("dragstart", function (e) {
    state.dragging = row.dataset.name;
    row.classList.add("dragging");
    try { e.dataTransfer.setData("text/plain", row.dataset.name); } catch (err) { /* old IE */ }
    e.dataTransfer.effectAllowed = "move";
  });
